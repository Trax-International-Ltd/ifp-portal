/* ============ Close-in obstacles (departures) — per runway end ============
   Ported from the close-in workbook (IDL-007-2), verified against its cached
   values for all 1 789 rows of the EGKK RWY08L assessment:
   Dr   = perpendicular distance from the DER line − obstacle radius (≥0)   [AREA A]
        = the straight-area length (distance to reach the TNA at the PDG,
          or the KK-line distance where entered)                            [turning]
   Do   = 0 [AREA A]; min distance to the DO datum segments − radius (≥0)   [turning]
   MOC  = 0.8% × Dr [AREA A] · clamp(0.8% × (Dr+Do), 75..300 m) [turning]
   OIS height  = (Dr+Do) × 2.5% + datum altitude (DER + 5 m)
   penetrates  = OIS height < obstacle elevation
   PDG required = (elev + MOC − datum alt) ÷ (Dr+Do)
   CLOSE-IN     = AREA A ∧ penetrates ∧ (elev + MOC − DER elev) < 60 m
   Highest PDG  = max PDG required over NON-close-in rows; where >3.3% the
   climb applies until ceil((PDG×t₂/(highest−PDG)+t₂) ÷ 0.3048, 100) ft.     */
function parseObstacleXml(text){
  const out=[]; const re=/<Penetration>([\s\S]*?)<\/Penetration>/g;
  const tag=(s,t)=>{const m=s.match(new RegExp("<"+t+">([^<]*)<\\/"+t+">"));return m?m[1]:"";};
  let m;
  while((m=re.exec(text))){
    const b=m[1];
    const om=b.match(/<Obstacle>([\s\S]*?)<\/Obstacle>/); const o=om?om[1]:"";
    out.push({surf:tag(b,"SurfaceDescription"),
      penX:safeNum(tag(b,"PenetrationX")),penY:safeNum(tag(b,"PenetrationY")),
      id:tag(o,"ID"),desc:tag(o,"Description"),

function cioDistToLine(x,y,L){        // perpendicular distance to the infinite DER line

  const seen=new Set(); const out=[];
  for(const o of matchObs){
    if(String(o.id||"").startsWith("UK")) continue;          // DVOF never match DVOF
    if(have.has(o.id+"|"+o.latlong)) continue;               // already in the assessment
    if(seen.has(o.id)) continue;
    seen.add(o.id);

function cioPointInPoly(x,y,poly){          // ray casting

  for(let i=0,j=poly.length-1;i<poly.length;j=i++){

    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=true;

function cioDistToPoly(x,y,poly){
  let d=Infinity;

    d=Math.min(d,cioDistToSeg(x,y,poly[j].x,poly[j].y,poly[i].x,poly[i].y));

function cioDistToSeg(x,y,x1,y1,x2,y2){
  const A=x-x1,B=y-y1,C=x2-x1,D=y2-y1, len=C*C+D*D;
  let t=len!==0?(A*C+B*D)/len:-1;

function cioCalc(r,d){

  const L=cio.derLine||{};
  const line={x1:safeNum(L.x1),y1:safeNum(L.y1),x2:safeNum(L.x2),y2:safeNum(L.y2)};
  if([line.x1,line.y1,line.x2,line.y2].some(v=>v==null)) return {need:"the DER line (two vertices)"};
  const derEle=safeNum(cio.derEle)??r2d(r.sid.elevM);
  if(derEle==null) return {need:"the DER elevation"};
  const dAlt=derEle+crit("sidDerH");
  const P=crit("sidPdg")/100, mocPct=crit("cioMocPct")/100, oisG=crit("cioOis")/100;

  const sc=sidCommonCalc(r,d);
  const drTurn=sc&&!sc.need?sc.distM:null;
  /* TWO-XML model: cio.obs is the NORMAL (un-enlarged) PDToolkit assessment —
     it alone drives every calculation, so containment is PDToolkit's own.
     cio.matchObs is the optional ENLARGED export, kept purely as the DVF
     match pool (surveyed obstacles only) — never assessed. */
  const segs=(cio.doSegs||[]).map(s=>({x1:safeNum(s.x1),y1:safeNum(s.y1),x2:safeNum(s.x2),y2:safeNum(s.y2)}))
              .filter(s=>[s.x1,s.y1,s.x2,s.y2].every(v=>v!=null));

    const isContour=String(o.desc||"").slice(0,7)==="Contour";
    const xi=isContour?o.penX:o.x, yi=isContour?o.penY:o.y;
    const isA=o.surf==="AREA A";
    let dr=null,doM=null;
    if(isA){ dr=Math.max(cioDistToLine(xi,yi,line)-o.radM,0); doM=0; }
    else{
      dr=drTurn;
      doM=segs.length?Math.max(Math.min(...segs.map(s=>cioDistToSeg(xi,yi,s.x1,s.y1,s.x2,s.y2)))-o.radM,0):null;
    }

    const dist=dr+doM;
    const moc=isA?mocPct*dr:Math.min(Math.max(mocPct*dist,crit("cioMinMoc")),crit("cioMaxMoc"));
    const ois=dist*oisG+dAlt;
    const pen=ois<o.elevM;

  let gov=null;
  for(const x of usable) if(x.closeIn!==true&&(gov===null||x.pdgReq>gov.pdgReq)) gov=x;
  const highest=gov?gov.pdgReq:0;
  let govUntil=null;
  if(gov&&highest>P){
    const t2=gov.elevM+gov.moc-dAlt-gov.dist*P, t3=highest-P;
    govUntil=Math.ceil((P*(t2/t3)+t2)/FT_M/100)*100;

  for(const x of usable) if(gov===null||x.pdgReq>(govCI?govCI.pdgReq:-1)) govCI=x;
  // ---- close-in list: dedupe (id+latlong); same location keeps the surveyed obstacle ----
  const ci=usable.filter(x=>x.closeIn===true);
  const seen=new Set(), ded=[];
  for(const x of ci){ const k=x.id+"|"+x.latlong; if(seen.has(k))continue; seen.add(k); ded.push(x); }
  const byLoc=new Map();
  for(const x of ded){ if(!byLoc.has(x.latlong))byLoc.set(x.latlong,[]); byLoc.get(x.latlong).push(x); }
  const list=[]; let autoRemoved=0;
  for(const xs of byLoc.values()){
    const surveyed=xs.filter(x=>!x.id.startsWith("UK"));
    if(surveyed.length&&surveyed.length<xs.length) autoRemoved+=xs.length-surveyed.length;
    for(const x of (surveyed.length?surveyed:xs)) list.push(x);
  }
  // surveyed pool for matching: the assessment set plus the match-set extras
  const surveyedAll=new Map();
  for(const x of usable) if(!x.id.startsWith("UK")&&!surveyedAll.has(x.id)) surveyedAll.set(x.id,x);
  for(const x of (cio.matchObs||[])) if(!surveyedAll.has(x.id)) surveyedAll.set(x.id,{...x,ext:true});
  /* AUTO-MATCH: a surveyed obstacle within cioAutoRad (1 m) of a DVOF obstacle
     is the same obstacle — the DVOF entry STAYS LISTED (the workbook removes
     duplicates at exact locations only) but is marked as its duplicate
     automatically, so no eyeball is needed. */
  const autoRad=crit("cioAutoRad");
  for(const x of list){
    if(!x.id.startsWith("UK")) continue;
    let best=null;
    for(const s of surveyedAll.values()){
      const dist=Math.hypot(s.x-x.x,s.y-x.y);
      if(dist<=autoRad&&(best===null||dist<best.dist)) best={id:s.id,dist,buffer:!!s.buffer};
    }
    if(best) x.autoDup=best;
  }
  list.sort((a,b)=>b.elevM-a.elevM||String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  const rad=crit("cioDvfRad");
  for(const x of list) if(x.id.startsWith("UK")){
    x.cands=[...surveyedAll.values()]
      .map(s=>({id:s.id,desc:s.desc,elevM:s.elevM,dist:Math.hypot(s.x-x.x,s.y-x.y),dElev:s.elevM-x.elevM,ext:!!s.ext}))
      .filter(c=>c.dist<=rad).sort((a,b)=>a.dist-b.dist).slice(0,3);
    if(!x.autoDup) x.autoNoMatch=true;   // nothing within the auto-match distance → NO MATCH by default, review optional
  }
  const effDup=x=>{const dv=(cio.dvf||{})[x.id]||{};return dv.dup||(x.autoDup?x.autoDup.id:(x.autoNoMatch?"NO MATCH":""));};
  const ukRows=list.filter(x=>x.id.startsWith("UK"));
  const ukMatched=ukRows.filter(x=>effDup(x)&&effDup(x)!=="NO MATCH").length;
  const ukNoMatch=ukRows.filter(x=>effDup(x)==="NO MATCH").length;
  const ukManual=ukRows.filter(x=>((cio.dvf||{})[x.id]||{}).dup).length;
  const ukOpen=0;
  return {rows:usable,total:rows.length,matchExtra:(cio.matchObs||[]).length,
          incomplete:rows.length-usable.length,
          penCount:usable.filter(x=>x.pen).length,ciCount:ci.length,

function omniCalc(r,d,oc){
  if(r.sid.elevM==null) return {need:"the DER elevation (SID datum)"};
  const g=safeNum(oc.pdg)??crit("sidPdg");

  const datum=r2d(r.sid.elevM)+crit("sidDerH");           // m
  /* Area 1 top = THE SID minimum turn altitude — taken from the SID common
     calculation so any TNA override entered on the SID page carries over */
  const sc=sidCommonCalc(r,d);
  const opFt=d.operative!=null?r2d(d.operative/FT_M):null;
  const tna=(sc&&sc.tna!=null)?sc.tna:(opFt!=null?opFt+crit("tnaAbove"):null);
  const dist=alt=>alt!=null&&alt*FT_M>datum?(alt*FT_M-datum)/(g/100):null;

  const rwLen=r2d(safeNum(oc.rwLen))??(r.sid.rwLenM!=null?r2d(r.sid.rwLenM):null);

            <div class="c">Surveyed DER ${r.sid.elevM!=null?f3(r.sid.elevM):"—"} m + ${crit("sidDerH")} m — ${r.sid.elevM!=null?((r.sid.elevM+crit("sidDerH"))/FT_M).toFixed(2):"—"} ft published (÷ 0.3048), since the turn altitudes are ft.</div></div>
        </div>
        <div class="tbl-wrap auto-h"><table>
          <thead><tr><th>Turn</th><th>Dist from previous (m)</th><th>Cum from DER (m)</th><th>Speed limit (kt IAS max)</th>
            <th>Alt restriction (ft)</th><th>Computed alt (ft)</th><th>Actual alt (ft)</th>
            <th>PANS-OPS — AOB · IAS</th><th>CAP778 — AOB · IAS</th><th>C (m)</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        ${(()=>{
          if(!c) return "";
          const cums=c.turns.map(t=>t.cum).filter(v=>v!=null);
          if(!cums.length) return "";
          const totM=cums[cums.length-1], totNM=totM/NM_M;
          return `<p class="note" style="margin:8px 0 0"><b>Total track distance:</b>
            <span class="mono">${totM.toFixed(2)} m · ${totNM.toFixed(2)} NM → <b>${Math.ceil(totNM-1e-9)} NM</b></span>
            <span style="color:var(--muted)">(final cumulative from the DER, rounded UP to the whole NM)</span></p>`;})()}
        ${c&&c.cats&&c.cats.length?`
        ${(()=>{const bad=c.turns.filter(t=>t.perCat.some(p=>p.belowSpeed));
          if(!bad.length) return "";
          return `<p class="note" style="color:#B91C1C;font-weight:700;margin:6px 0 0">⚠ ${bad.map(t=>`TP${t.n}: the ${t.limit} kt limit is below the minimum allowable turn speed for ${t.perCat.filter(p=>p.belowSpeed).map(p=>"CAT "+p.cat+" ("+p.minAllow.toFixed(2)+" kt)").join(", ")}`).join(" · ")} — minimum = intermediate MA IAS × ${crit("sidMassF")}.</p>`;})()}`:""}
        ${c&&c.turns[0]&&c.turns[0].beforeMin?`
        <p class="note" style="color:#B91C1C;font-weight:700;margin:6px 0 0">⚠ Turn 1 is ${c.turns[0].shortBy.toFixed(2)} m BEFORE the minimum
          first-turn distance — entered ${c.turns[0].dist.toFixed(2)} m vs minimum ${c.minDistM.toFixed(2)} m
          (climb to TNA ${minc&&minc.tna!=null?minc.tna.toFixed(2)+" ft":""} at ${crit("sidPdg")}%).</p>`:""}
        <button class="ghost sidp-addturn" data-si="${si}" style="padding:5px 14px;margin-top:8px">+ Add a turn</button>
      </div></div>`;}).join("");
  return `${viewSidCommon(r,d)}
  <div class="hub" style="margin-top:18px">
    ${sidCards}
    <div class="card full">
      <div class="hd">SIDs — ${typeLabel}<span class="right">${sids.length} defined</span></div>
      <div class="bd">
        ${sids.length?"":`<p class="note" style="margin-top:0">No ${typeLabel} SIDs defined yet for ${esc(r.key)}.</p>`}
        <button class="act" id="sidp-add" style="padding:6px 16px">+ Add a SID</button>
        ${sids.length?`<button class="act" id="sidp-calc" style="padding:6px 20px;margin-left:10px"><b>Calculate</b></button>
        <span class="note" style="margin-left:10px">Enter the SID details, then Calculate — the constraint logic reads the whole SID. Aerodrome SID cap: <b>${crit("sidCap")} ft</b> (Design criteria page).</span>
        <details id="sid-notes"${S._sidNotesOpen?" open":""} style="margin-top:10px">
          <summary style="cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Method notes — restrictions · cap · rounding · speeds · AOB bands</summary>
          <p class="note" style="margin:8px 0 0">Restrictions: <b>≥</b> at or above (the climb may exceed it; where the design gradient cannot reach it, the restriction GOVERNS the turn and the required gradient is shown) ·
          <b>≤</b> at or below · <b>=</b> at. A SID cannot descend, so a later ≤/= constraint also ceilings every earlier turn.
          A turn with no ≤/= constraint climbs no higher than the aerodrome SID cap (${crit("sidCap")} ft — set per aerodrome on the Design criteria page).
          Computed altitude climbs at the SID gradient over each segment (m → ft ÷ 0.3048), then rounds UP to ${crit("sidAltRound")||"—"} ft (Design criteria; 0 = off) to give the ACTUAL altitude; constraints and the SID cap apply to that, and later turns climb on from it.
          Turn speed per category: the tabled final-MA IAS × ${crit("sidMassF")} (increased for departure mass) FIRST, then capped at the turn's speed limit where one applies — e.g. CAT C 240 × ${crit("sidMassF")} = 264, capped at a 250 kt restriction → 250 used. A limit is never taken below the intermediate MA IAS × ${crit("sidMassF")}. C = ${crit("sidCSec")} s at TAS(IAS, actual altitude, ISA+${crit("isaDev")}) + ${crit("sidWind")} kt wind.
          AOB &amp; speed bands use the turn's ACTUAL altitude (AMSL): <b>PANS-OPS</b> (nominal track only) ${crit("poAob1")}° to ${crit("poBand1")} ft · ${crit("poAob2")}° to ${crit("poBand2")} ft · ${crit("poAob3")}° above, speed = the tabled value for the HIGHEST selected category (one nominal track, built on the larger values);
          <b>CAP778</b> ${crit("cpAob1")}° below ${crit("cpAobBand")} ft, ${crit("cpAob2")}° thereafter · ${crit("cpSpd1")} kt to ${crit("cpSpdBand")} ft, ${crit("cpSpd2")} kt thereafter, unless restricted.</p>
        </details>`:""}
      </div>
    </div>
  </div>`;
}
function wireSidPage(key,procId){
  wireSidCommon(key);
  const getSids=()=>{
    const pc=ensureProcCfg(key,procId);
    if(!pc.sids) pc.sids=[];
    return pc.sids;
  };
  const add=document.getElementById("sidp-add");
  if(add) add.addEventListener("click",()=>{
    getSids().push({name:"",pdg:"",turns:[{name:"",dist:"",limit:"",rtype:"none",restrict:""}]}); render();});
  const nts=document.getElementById("sid-notes");
  if(nts) nts.addEventListener("toggle",e=>{S._sidNotesOpen=e.target.open;});
  const calc=document.getElementById("sidp-calc");
  if(calc) calc.addEventListener("click",()=>{
    const d2=compute(); const r2=d2.runways.find(x=>x.key===key);
    getSids().forEach(s=>{s.calcHash=sidHash(r2,s,d2.operative);});
    render();});
  document.querySelectorAll(".sidp-del").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); getSids().splice(+e.target.dataset.si,1); render();}));
  document.querySelectorAll(".sidp-name").forEach(inp=>inp.addEventListener("change",e=>{
    getSids()[+e.target.dataset.si].name=e.target.value; render();}));
  document.querySelectorAll(".sidp-catreset").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); delete getSids()[+e.target.dataset.si].cats; render();}));
  document.querySelectorAll(".sidp-cat").forEach(cb=>cb.addEventListener("change",e=>{
    const s=getSids()[+e.target.dataset.si];
    if(!s.cats){const rc=(ensureCfg(key).cats)||{};s.cats={A:!!rc.A,B:!!rc.B,C:!!rc.C,D:!!rc.D};}
    s.cats[e.target.dataset.cat]=e.target.checked; render();}));
  document.querySelectorAll(".sidp-pdg").forEach(inp=>inp.addEventListener("change",e=>{
    getSids()[+e.target.dataset.si].pdg=e.target.value; render();}));
  document.querySelectorAll(".sidp-turn").forEach(inp=>inp.addEventListener("change",e=>{
    getSids()[+e.target.dataset.si].turns[+e.target.dataset.ti][e.target.dataset.f]=e.target.value; render();}));
  document.querySelectorAll(".sidp-addturn").forEach(b=>b.addEventListener("click",e=>{
    getSids()[+e.target.dataset.si].turns.push({name:"",dist:"",limit:"",rtype:"none",restrict:""}); render();}));
  document.querySelectorAll(".sidp-delturn").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); getSids()[+e.target.dataset.si].turns.splice(+e.target.dataset.ti,1); render();}));
}
function wireProc(){
  const {rwy:key,proc:procId}=S.view;
  document.getElementById("back-rwy").addEventListener("click",()=>go("rwy",key));
  document.querySelectorAll(".seg-tabs [data-seg]").forEach(b=>b.addEventListener("click",()=>
    go("proc",key,procId,b.dataset.seg)));
  if(procId==="ILS"&&S.view.seg==="missed") wireIlsMA(key);
  if(procId==="ILS"&&S.view.seg==="adv") wireIlsAdv(key);
  if(procId==="ILS"&&S.view.seg==="inter") wireIlsInter(key);
  if(procId==="SRA"&&S.view.seg==="final") wireSraFinal(key);
  if(procId==="LOC"&&S.view.seg==="final") wireLocFinal(key);
  if(procId==="LOC"&&S.view.seg==="inter") wireLocInter(key);
  if(procId==="LOC"&&S.view.seg==="initial") wireLocInitial(key);
  if(procId==="SIDC"||procId==="SIDPBN") wireSidPage(key,procId);
  if(procId==="OMNI") wireOmni(key,procId);
  document.querySelectorAll(".proc-in").forEach(inp=>inp.addEventListener("change",e=>{
    ensureProcCfg(key,procId)[e.target.dataset.f]=e.target.value; render();}));

  document.querySelectorAll(".llz-in").forEach(inp=>inp.addEventListener("change",e=>{
    S.manualLlz[key]=S.manualLlz[key]||{ident:"",e:"",n:""};

    render();
  }));
}

/* ---------- survey codes ---------- */
function viewCodes(d){
  const counts=new Map();
  for(const p of d.pts) counts.set(p.code,(counts.get(p.code)||0)+1);
  const unknown=[...counts.keys()].filter(c=>!CODES.has(c));
  const seenKnown=[...counts.keys()].filter(c=>CODES.has(c)).sort();
  const makeRow=(code,known)=>{
    const base=CODES.get(code);
    const inc=S.codeOverrides[code] ?? (base?base.include:"?");
    const n=counts.get(code)||0;
    return `<tr>
      <td class="${known?"":"chk-bad"}">${esc(code)}</td>
      <td class="t">${esc(base?base.canon:"")}</td>
      <td class="in"><select class="inc-sel" data-code="${esc(code)}">
        ${!known&&!(code in S.codeOverrides)?'<option selected>?</option>':""}
        <option${inc==="Y"?" selected":""}>Y</option>
        <option${inc==="N"?" selected":""}>N</option></select></td>
      <td class="num auto">${n||""}</td>
      <td class="auto">${esc(base?.llz||"")}</td>
      <td class="t" style="white-space:normal;max-width:520px">${esc(base?base.note:(known?"":"Not in the code table — decide whether this point counts as part of the runway."))}</td>
    </tr>`;};
  let html=`
  <h2>Survey codes — what counts as runway</h2>
  <p class="note">Include = <b>Y</b> means the point counts as <i>part of the runway</i> for the CAA aerodrome-elevation
    method. Changes recalculate everything immediately. Notable decisions carried over from the workbook:
    <b>ARP = N</b> (not a runway-surface value), <b>TODA_END = Y</b> (at your request — beyond the pavement where a clearway exists).</p>`;
  if(unknown.length){
    html+=`<div class="verdict bad"><div class="word">${unknown.length} UNRECOGNISED CODE(S)</div>
      <div class="detail">These points are excluded from the aerodrome-elevation max until you decide Y/N.</div></div>
      <div class="tbl-wrap auto-h"><table>
      <thead><tr><th>Code (as in survey)</th><th>Canonical</th><th>Include?</th><th>Seen (n)</th><th>LLZ role</th><th>Notes</th></tr></thead>
      <tbody>${unknown.map(c=>makeRow(c,false)).join("")}</tbody></table></div>`;
  }
  html+=`<h2 style="margin-top:22px">Codes in this survey</h2>
    <div class="tbl-wrap"><table>
    <thead><tr><th>Code (as in survey)</th><th>Canonical</th><th>Include?</th><th>Seen (n)</th><th>LLZ role</th><th>Notes</th></tr></thead>
    <tbody>${seenKnown.map(c=>makeRow(c,true)).join("")}</tbody></table></div>`;
  return html;
}

/* ============================ files in/out =========================== */
function handleSurveyFile(file){
  const errEl=document.getElementById("import-err");
  if(errEl) errEl.innerHTML="";
  const isCsv=/\.csv$/i.test(file.name);
  const reader=new FileReader();
  reader.onerror=()=>{ if(errEl) errEl.innerHTML=`<div class="err-log">Could not read the file.</div>`; };
  reader.onload=()=>{
    try{
      const rows=isCsv?parseCsvText(reader.result):parseXlsxBuffer(new Uint8Array(reader.result));
      loadSurvey(rows,file.name);
      go("hub");
    }catch(err){
      const el=document.getElementById("import-err");
      if(el) el.innerHTML=`<div class="err-log">Import failed — ${esc(err.message)}\n\nNothing was changed. Re-select a known-good CAP1732 file.</div>`;
    }
  };
  if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function download(name,data,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:mime}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCsv(){
  const d=compute(); if(!d) return;
  const head="Point_ID,Code,Runway_ID,Easting,Northing,Elev_m,Elev_ft,Ident,Survey_Date";
  const lines=d.pts.map(p=>[p.id,p.code,p.assoc,p.e,p.n,p.elevM,p.elevFt,p.ident,p.sdate].map(v=>String(v??"")).join(","));
  download(`${S.icao}_survey_points.csv`,[head,...lines].join("\n"),"text/csv");
}
/* --- project payload (shared by Save, Open and autosave) --- */
function projectPayload(){
  return {tool:"IFP Design Calculator project", version:2, saved:new Date().toISOString(),
    icao:S.icao, fileName:S.fileName, company:S.company, procDate:S.procDate,
    vertRef:S.vertRef, points:S.points,
    decisions:{tolMatch:S.tolMatch, manualAEP:S.manualAEP,
               codeOverrides:S.codeOverrides, rwyCfg:S.rwyCfg, manualLlz:S.manualLlz, criteria:S.criteria,
               vmc:S.vmc, sra:S.sra}};
}
function applyProject(p){
  if(!p||!String(p.tool||"").startsWith("IFP Design")||!Array.isArray(p.points))
    throw new Error("Not an IFP Design Calculator project file.");
  S.loaded=true; S.icao=p.icao||""; S.fileName=p.fileName||"";
  S.company=p.company||""; S.procDate=p.procDate||""; S.vertRef=p.vertRef||"";
  S.points=p.points;
  const dcs=p.decisions||{};
  S.tolMatch=dcs.tolMatch??0.005; S.manualAEP=dcs.manualAEP??"";
  S.codeOverrides=dcs.codeOverrides||{}; S.manualLlz=dcs.manualLlz||{};
  S.criteria=dcs.criteria||{};
  S.vmc=dcs.vmc||{ocaOv:{},obs:{}};
  S.sra=dcs.sra||{pid:"",confirmed:false};
  if(S.criteria.wind!=null){   // short-lived global wind key → per-procedure keys
    if(S.criteria.maWind==null) S.criteria.maWind=S.criteria.wind;
    if(S.criteria.sidWind==null) S.criteria.sidWind=S.criteria.wind;
    delete S.criteria.wind;
  }
  S.rwyCfg=dcs.rwyCfg||{};
  if(!dcs.rwyCfg && dcs.ilsDecl){        // migrate older project files
    for(const [k,v] of Object.entries(dcs.ilsDecl)) if(v==="YES")
      S.rwyCfg[k]={cats:{},procs:{ILS:true},proc:{}};
  }
  if((p.version||1)<2){   // v1 stored surveyed manual entries in FEET — the tool now works in metres
    const mA=safeNum(S.manualAEP);
    if(mA!=null) S.manualAEP=String(+(mA*FT_M).toFixed(4));
    if(S.tolMatch!=null&&S.tolMatch!==0.005) S.tolMatch=+(S.tolMatch*FT_M).toFixed(6);
    for(const cfg of Object.values(S.rwyCfg)){
      const mv=cfg&&cfg.sidCommon?safeNum(cfg.sidCommon.manElev):null;
      if(mv!=null) cfg.sidCommon.manElev=String(+(mv*FT_M).toFixed(4));
    }
  }
}
function saveProject(){
  if(!S.loaded) return;
  download(`${S.icao}_ifp_project.json`, JSON.stringify(projectPayload(),null,1), "application/json");
}
function openProject(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{ applyProject(JSON.parse(reader.result)); go("hub"); }
    catch(err){ alert("Could not open the project: "+err.message); }
  };
  reader.readAsText(file);
}

const AUTOSAVE_KEY="ifp_design_tool_autosave_v1";
function autosave(){

function readAutosave(){

/* ====================== CAA workbook export ========================== */
/* Generates the presentation workbook fresh from the live values.
   Colour convention matches the original tool:
     navy #1F3864 header (white text) · yellow #FFF2CC surveyed/entered
     grey #D9D9D9 calculated · red text = a check needing attention        */
const XC={ NAVY:"FF1F3864", YELLOW:"FFFFF2CC", GREY:"FFD9D9D9", WHITE:"FFFFFFFF",
           RED:"FFB42318", GREEN:"FF1E7B44", AMBER:"FF9A6700", BORDER:"FFBFBFBF" };
function xFill(argb){ return {type:"pattern",pattern:"solid",fgColor:{argb}}; }
function xBorder(){ const s={style:"thin",color:{argb:XC.BORDER}}; return {top:s,left:s,bottom:s,right:s}; }
function styleHeaderRow(row){
  row.eachCell(c=>{ c.fill=xFill(XC.NAVY); c.font={color:{argb:XC.WHITE},bold:true,size:9,name:"Arial"};
                    c.border=xBorder(); c.alignment={vertical:"middle"}; });
}
function dataCell(c,kind,numFmt){
  c.border=xBorder(); c.font={size:9,name:"Arial"};
  if(kind==="in") c.fill=xFill(XC.YELLOW);
  if(kind==="auto") c.fill=xFill(XC.GREY);
  if(numFmt) c.numFmt=numFmt;
}
function titleCell(ws,ref,text){
  const c=ws.getCell(ref); c.value=text;
  c.font={bold:true,size:11,name:"Arial",color:{argb:XC.NAVY}};
}
function sectionCell(ws,ref,text){
  const c=ws.getCell(ref); c.value=text;
  c.fill=xFill(XC.NAVY); c.font={color:{argb:XC.WHITE},bold:true,size:9,name:"Arial"};
}
async function exportCaaWorkbook(){
  const d=compute(); if(!d) return;
  const wb=new ExcelJS.Workbook();
  wb.creator="IFP Design Calculator"; wb.created=new Date();
  const genStamp=new Date().toISOString().slice(0,10);

  /* ---- Summary ---- */
  {
    const ws=wb.addWorksheet("Summary");
    ws.columns=[{width:36},{width:26},{width:60}];
    titleCell(ws,"A1",`${S.icao} — IFP DESIGN · SURVEY-DERIVED VALUES`);
    ws.getCell("A2").value=`Generated ${genStamp} by the IFP Design Calculator. Elevations are ORTHOMETRIC (AMSL), used AS SURVEYED (CAP1732 fields 17 & 18).`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const rows=[
      ["Aerodrome",S.icao],
      ["Survey originator",S.company||"—"],
      ["Survey processed",S.procDate||"—"],
      ["Vertical reference",S.vertRef||"—"],
      ["Source file",S.fileName],
      ["Survey points (total / included)",`${d.total} / ${d.included}`],
      ["Aerodrome elevation — surveyor effective (m)",d.effective],
      ["Aerodrome elevation — computed from survey (m)",d.maxP?d.maxP.inclM:null],
      ["Driving point",d.maxP?`${d.maxP.id} · ${d.maxP.code} · ${d.maxP.assoc||"—"}`:"—"],
      ["Difference computed − surveyor (m)",d.diff],
      ["Match tolerance (m)",S.tolMatch],
      ["STATUS",d.status],
      ["OPERATIVE AERODROME ELEVATION (m) — most conservative",d.operative],
      ["OPERATIVE — published (ft, ÷ 0.3048)",d.operative!=null?d.operative/FT_M:null],
      ["Operative value source",d.operativeSrc],
    ];
    let r=4;
    for(const [k,v] of rows){
      const ck=ws.getCell(r,1), cv=ws.getCell(r,2);
      ck.value=k; dataCell(ck,null);
      cv.value=v; dataCell(cv, typeof v==="number"?"auto":"auto",
                  typeof v==="number"?"0.000":null);
      if(k==="STATUS"){ cv.font={size:9,name:"Arial",bold:true,
        color:{argb:d.statusClass==="ok"?XC.GREEN:XC.AMBER}}; }
      if(k.startsWith("OPERATIVE")){ cv.font={size:9,name:"Arial",bold:true}; }
      r++;
    }
  }

  /* ---- Aerodrome_Elevation ---- */
  {
    const ws=wb.addWorksheet("Aerodrome_Elevation");
    ws.columns=[{width:44},{width:18},{width:16},{width:14}];
    titleCell(ws,"A1","AERODROME ELEVATION — CHECK OF THE SURVEYOR'S VALUE");
    ws.getCell("A2").value="Doc 8168: 'the elevation of the highest point of the landing area'. Check: the highest point on any part of the runway, computed from the included survey points, compared with the surveyor's AEP. The more conservative (higher) value is carried forward. AEP excluded from the computed max so the comparison stays independent.";
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    sectionCell(ws,"A4","A · SURVEYOR'S DECLARED VALUE");
    const put=(r,k,v,kind,fmt)=>{const ck=ws.getCell(r,1),cv=ws.getCell(r,2);
      ck.value=k;dataCell(ck,null);cv.value=v;dataCell(cv,kind,fmt);return cv;};
    put(5,"AEP from survey file (m)",d.aepFile,"auto","0.000");
    put(6,"From surveyor's report (m) — manual entry",d.manual,"in","0.000");
    put(7,"Surveyor's value — EFFECTIVE (m)",d.effective,"auto","0.000").font={bold:true,size:9,name:"Arial"};
    sectionCell(ws,"A9","B · COMPUTED FROM SURVEY (highest point on any part of the runway)");
    put(10,"Max elevation, included points (m)",d.maxP?d.maxP.inclM:null,"auto","0.000").font={bold:true,size:9,name:"Arial"};
    put(11,"Driving point — ID",d.maxP?d.maxP.id:"—","auto");
    put(12,"Driving point — code",d.maxP?d.maxP.code:"—","auto");
    put(13,"Driving point — runway",d.maxP?(d.maxP.assoc||"—"):"—","auto");
    put(14,"Points included / total",`${d.included} / ${d.total}`,"auto");
    put(15,"Unrecognised codes",d.unk.size,"auto");
    sectionCell(ws,"A17","C · COMPARISON");
    put(18,"Difference computed − surveyor (m)",d.diff,"auto","0.000");
    put(19,"Match tolerance (m)",S.tolMatch,"in","0.000");
    const st=put(20,"STATUS",d.status,"auto");
    st.font={bold:true,size:9,name:"Arial",color:{argb:d.statusClass==="ok"?XC.GREEN:XC.AMBER}};
    sectionCell(ws,"A22","D · OPERATIVE AERODROME ELEVATION — MOST CONSERVATIVE VALUE");
    put(23,"OPERATIVE AERODROME ELEVATION (m)",d.operative,"auto","0.000").font={bold:true,size:9,name:"Arial"};
    put(24,"Source",d.operativeSrc,"auto");
    put(25,"Published (ft) — ÷ 0.3048, Annex 5",d.operative!=null?d.operative/FT_M:null,"auto","0.000");
    put(26,"Driving point — field-18 ft as surveyed (cross-check)",d.maxP?d.maxP.elevFt:null,"auto","0.000");
    sectionCell(ws,"A27","E · PER-RUNWAY BREAKDOWN (included points only)");
    const hd=ws.getRow(28); hd.values=["Runway","Max elev (m)","Driving code","Point ID"];
    styleHeaderRow(hd);
    let r=29;
    for(const rw of d.runways){
      const vals=[rw.key, rw.rwyMax?rw.rwyMax.inclM:null, rw.rwyMax?rw.rwyMax.code:"—", rw.rwyMax?rw.rwyMax.id:"—"];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,"auto",i===1?"0.000":null);});
      r++;
    }
  }

  /* ---- Runways ---- */
  {
    const ws=wb.addWorksheet("Runways");
    titleCell(ws,"A1","RUNWAYS — PER-RUNWAY MASTER (SURVEY-DERIVED)");
    ws.getCell("A2").value="Elevations as surveyed (CAP1732 fields 17 & 18) — the metre value (field 17) is the working value; ft are published ÷ 0.3048 (Annex 5). ILS? is the designer's declaration. Only the localizer ANTENNA is used for THR→LLZ; monitor kit excluded.";
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Runway_ID","THR_Elev_m","THR_Elev_ft","THR_Easting","THR_Northing",
                "Categories","Procedures","LLZ_ident","LLZ_Easting","LLZ_Northing","THR_LLZ_m","LLZ_check","Survey_Ref"];
    ws.columns=cols.map((c,i)=>({width:i===12?38:(i===6?16:13)}));
    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r=5;
    for(const rw of d.runways){
      const vals=[rw.key,rw.thr.elevM,rw.thr.elevFt,rw.thr.e,rw.thr.n,
                  rw.catsOn.join(" ")||"—",rw.procsOn.join(", ")||"—",
                  rw.llzId||"",rw.llzE,rw.llzN,rw.dist,rw.llzCheck,rw.ref];
      const kinds=["in","in","in","in","in","in","in","in","in","in","auto","auto","auto"];
      const fmts=[null,"0.000","0.000","0.000","0.000",null,null,null,"0.000","0.000","0.00",null,null];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,kinds[i],fmts[i]);});
      if(rw.llzCheck!=="ok"&&rw.llzCheck!=="no ILS/LOC")
        ws.getCell(r,12).font={size:9,name:"Arial",bold:true,color:{argb:XC.AMBER}};
      r++;
    }
  }

  /* ---- ILS_Config (only when at least one runway has ILS declared) ---- */
  if(d.runways.some(rw=>rw.ilsOn)){
    const ws=wb.addWorksheet("ILS_Config");
    titleCell(ws,"A1","ILS CONFIGURATION — RDH & GLIDE PATH, PER RUNWAY");
    ws.getCell("A2").value=`Standard RDH ${crit("rdhStd")} ft. Glide path: minimum ${crit("vpaMin")}° · optimum ${crit("vpaOpt")}° · maximum ${crit("vpaMax")}°. RDH source is the designer's declaration of which value governs.`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Runway_ID","RDH_charted_ft","RDH_calibration_ft","Cal_report_ref","RDH_source",
                "RDH_operative_ft","Diff_cal_minus_charted_ft","vs_standard_50ft","Glide_path_deg","Angle_check","FAF_alt_ft"];
    ws.columns=cols.map((c,i)=>({width:i===3?22:14}));
    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r=5;
    for(const rw of d.runways.filter(x=>x.ilsOn)){
      const vals=[rw.key,rw.rdhCharted,rw.rdhCal,rw.ic.calRef||"",rw.rdhSource,
                  rw.rdhOperative,rw.rdhDiff,
                  rw.rdhOperative!=null?rw.rdhOperative-crit("rdhStd"):null,
                  rw.vpa,rw.vpaCheck||"",rw.faf];
      const kinds=["in","in","in","in","in","auto","auto","auto","in","auto","in"];
      const fmts=[null,"0.00","0.00",null,null,"0.00","0.00","0.00","0.00",null,"0"];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,kinds[i],fmts[i]);});
      if(rw.vpaCheck.startsWith("below")||rw.vpaCheck.startsWith("above"))
        ws.getCell(r,10).font={size:9,name:"Arial",bold:true,color:{argb:XC.AMBER}};
      if(rw.rdhCheck==="DIFFERS")
        ws.getCell(r,7).font={size:9,name:"Arial",bold:true,color:{argb:XC.AMBER}};
      r++;
    }
  }

  /* ---- ILS_Final (FAF & FAP calculations, only where computed) ---- */
  if(d.runways.some(rw=>rw.finalCalc)){
    const ws=wb.addWorksheet("ILS_Final");
    titleCell(ws,"A1","ILS — FINAL APPROACH · FAF TRACK LENGTH & FAP DISTANCE");
    ws.getCell("A2").value=`FAF: height above the RDH datum ÷ tan(glide path), rounded UP to 0.1 NM (NB PANS-OPS App C para 3 says nearest). FAP: H = h + ${OAS_FTNM}·D·tanθ + ${OAS_CURV_K}·D² solved for D with h = ${crit("rdhStd")} ft, then ΔD = ${RDH_ADJ_K} × ${OAS_FTNM} × (${crit("rdhStd")} − RDH) × cotθ at the actual angle.`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Runway_ID","THR_elev_ft","RDH_operative_ft","GP_deg","FAF_alt_ft",
                "Hgt_above_RDH_datum_ft","FAF_track_m","FAF_NM_unrounded","FAF_chart_NM",
                "D_NM","D_ft","RDH_adj_dD_ft","FAP_ft","FAP_m","FAP_NM"];
    ws.columns=cols.map(()=>({width:14}));
    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r2=5;
    for(const rw of d.runways.filter(x=>x.finalCalc)){
      const c=rw.finalCalc;
      const vals=[rw.key,rw.thrFt,rw.rdhOperative,rw.vpa,rw.faf,
                  c.hgt,c.fafM,c.fafNM,c.fafChart,c.Dnm,c.Dft,c.dD,c.fapFt,c.fapM,c.fapNM];
      const kinds=["in","in","in","in","in","auto","auto","auto","auto","auto","auto","auto","auto","auto","auto"];
      const fmts=[null,"0.000","0.00","0.00","0","0.000","0.000","0.0000","0.0","0.000000","0.00","0.000","0.00","0.000","0.0000"];
      vals.forEach((v,i)=>{const cell=ws.getCell(r2,i+1);cell.value=v;dataCell(cell,kinds[i],fmts[i]);});
      ws.getCell(r2,9).font={size:9,name:"Arial",bold:true};
      ws.getCell(r2,15).font={size:9,name:"Arial",bold:true};
      r2++;
    }
  }

  /* ---- Close_In_Obstacles (per runway end, where assessed) ---- */
  {
    const withCio=d.runways.filter(rw=>{const c=rw.cfg.cio;return c&&c.obs&&c.obs.length;});
    if(withCio.length){
      const ws=wb.addWorksheet("Close_In_Obstacles");
      titleCell(ws,"A1","CLOSE-IN OBSTACLES — DEPARTURES, PER RUNWAY END");
      ws.getCell("A2").value=`From the PDToolkit departure-splay assessment. Close-in: penetrates the ${crit("cioOis")}% OIS and (elevation + MOC − DER elevation) < ${crit("cioCloseH")} m. De-duplicated on ID + lat/long; at identical positions the surveyed obstacle is kept. DVF (UK…) rows show the designer's eyeball match against surveyed obstacles.`;
      ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
      const cols=["Runway","ID","Description","Lat/Long","Elevation_m","PDG_required","Duplicate_survey_obs","Comments"];
      ws.columns=[{width:9},{width:15},{width:42},{width:26},{width:12},{width:12},{width:20},{width:30}];
      const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
      let r2=5;
      for(const rw of withCio){
        const c=cioCalc(rw,d);
        if(c.need) continue;
        for(const x of c.list){
          const dv=(rw.cfg.cio.dvf||{})[x.id]||{};
          const vals=[rw.key,x.id,x.desc,x.latlong,x.elevM,x.pdgReq,
                      x.id.startsWith("UK")?(dv.dup||(x.autoDup?`${x.autoDup.id} (auto ${x.autoDup.dist.toFixed(2)} m)`:"NO MATCH (auto)")):"",dv.comment||""];
          vals.forEach((v,i)=>{const cell=ws.getCell(r2,i+1);cell.value=v;
            dataCell(cell,i>=6?"in":"auto",i===4?"0.00":i===5?"0.00%":null);});

          r2++;
        }
      }
    }
  }

  /* ---- Survey_Points ---- */
  {
    const ws=wb.addWorksheet("Survey_Points");
    titleCell(ws,"A1",`SURVEY POINTS — ${S.icao} · AS IMPORTED`);
    ws.getCell("A2").value=`Imported: ${S.icao} | ${S.company||"—"} | processed ${S.procDate||"—"} | vertical ref: ${S.vertRef||"—"} | ${d.total} points | ORTHOMETRIC (AMSL) elevations, as surveyed`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Point_ID","Code","Runway_ID","Easting/X","Northing/Y","Elev_m","Elev_ft",
                "Include?","Elev_m_incl","Ident","Survey_Date","LLZ_role"];
    ws.columns=cols.map((c,i)=>({width:i===9?30:12}));
    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r=5;
    for(const p of d.pts){
      const vals=[p.id,p.code,p.assoc,p.e,p.n,p.elevM,p.elevFt,p.include,p.inclM,p.ident,p.sdate,p.llz||""];
      const kinds=["in","in","in","in","in","in","in","auto","auto",null,"in","auto"];
      const fmts=[null,null,null,"0.000","0.000","0.000","0.000",null,"0.000",null,null,null];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,kinds[i],fmts[i]);
        if(i===0||i===1||i===2||i===10) c.numFmt="@";});   // IDs/designators as text — "07" stays "07"
      if(p.include==="?") ws.getCell(r,8).font={size:9,name:"Arial",bold:true,color:{argb:XC.RED}};
      r++;
    }
  }

  const buf=await wb.xlsx.writeBuffer();
  download(`${S.icao}_IFP_CAA_${genStamp}.xlsx`, buf,
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* ============================ wiring ================================= */
document.getElementById("file-survey").addEventListener("change",e=>{
  if(e.target.files.length) handleSurveyFile(e.target.files[0]); e.target.value="";});
document.getElementById("file-project").addEventListener("change",e=>{
  if(e.target.files.length) openProject(e.target.files[0]); e.target.value="";});
document.getElementById("btn-save").addEventListener("click",saveProject);
document.getElementById("btn-load").addEventListener("click",()=>document.getElementById("file-project").click());
document.getElementById("btn-export").addEventListener("click",()=>{exportCaaWorkbook().catch(err=>alert("Export failed: "+err.message));});
/* Back/forward walk the tool's own views instead of leaving the page */
window.addEventListener("popstate",e=>{ if(e.state){ S.view=e.state; render(); window.scrollTo(0,0); } });
try{ history.replaceState(S.view,""); }catch(e){}
/* Leaving the document (close tab, back past the first page) asks first */
window.addEventListener("beforeunload",e=>{ if(S.loaded){ e.preventDefault(); e.returnValue=""; } });
render();
</script>
</body>
</html>
