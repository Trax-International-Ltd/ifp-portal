<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#002039">
<title>IFP Design Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* ---- IFP house theme (mirrors the shared stylesheet of the Surface Filtering Tool / Surface List Generator) ---- */
:root{
  --ifp-bg:#f5f7f9; --ifp-surface:#ffffff; --ifp-surface-2:#f7f9fb; --ifp-field:#ffffff;
  --ifp-text:#1b2733; --ifp-navy:#002039;
  --ifp-n400:#5b6b7a; --ifp-n500:#6f7f8d; --ifp-n600:#8a98a5; --ifp-n800:#e2e8ee; --ifp-n900:#eef2f5;
  --ifp-line:#cfd8e0;
  --ifp-accent:#0982C1; --ifp-accent-300:#0982C1; --ifp-accent-400:#076ca1; --ifp-accent-600:#0982C1; --ifp-accent-700:#0982C1; --ifp-accent-800:#e6f2f9; --ifp-accent-900:#eaf1f6;
  --ifp-orange:#0982C1;
  --ifp-ok:#1d7a46; --ifp-ok-bg:#e7f3ec; --ifp-warn:#9a6700; --ifp-warn-bg:#fbf3dc; --ifp-err:#b3261e; --ifp-err-bg:#fbe9e7;
  --ifp-divider:rgba(27,39,51,.12);
  --ifp-card:0 0 0 1px #e2e8ee,0 1px 2px rgba(0,32,57,.06),0 4px 16px rgba(0,32,57,.05);
  --ifp-card-hover:0 0 0 1px #0982C1,0 2px 4px rgba(0,32,57,.08),0 10px 28px rgba(0,32,57,.10);
  --ifp-bar-bg:#002039; --ifp-bar-text:#ffffff; --ifp-bar-muted:#a8bccb; --ifp-bar-line:rgba(255,255,255,.14);
  --ifp-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ifp-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
.ifp-bar{display:flex;align-items:center;gap:12px;height:44px;flex:0 0 auto;padding:0 18px;
  background:var(--ifp-bar-bg);color:var(--ifp-bar-text);font-family:var(--ifp-font);font-size:13px;line-height:1;position:relative;z-index:30}
.ifp-bar a.ifp-home{display:inline-flex;align-items:center;gap:8px;color:var(--ifp-bar-text);text-decoration:none;font-weight:600;font-size:15px}
.ifp-bar a.ifp-home svg{width:14px;height:14px;fill:#5fb6e6}
.ifp-bar a.ifp-home:hover{color:#8fd0f3}
.ifp-bar .ifp-sep{color:var(--ifp-bar-muted)}
.ifp-bar .ifp-here{color:var(--ifp-bar-muted)}
.ifp-bar .ifp-kind{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ifp-bar-muted)}
:focus-visible{outline:2px solid var(--ifp-accent);outline-offset:2px}

:root{
  --navy:var(--ifp-accent-800); --navy-deep:var(--ifp-accent-900);
  --paper:var(--ifp-bg); --panel:var(--ifp-surface); --panel-2:var(--ifp-surface-2); --ink:var(--ifp-text); --muted:var(--ifp-n400);
  --head:var(--ifp-navy);
  --input-y:#FFF2CC; --input-y-deep:#F5E3A6;
  --auto-g:#ECECEA; --auto-g-deep:#D9D9D9;
  --line:var(--ifp-line); --line-soft:var(--ifp-n800);
  --red:var(--ifp-err); --red-bg:var(--ifp-err-bg);
  --green:var(--ifp-ok); --green-bg:var(--ifp-ok-bg);
  --amber:var(--ifp-warn); --amber-bg:var(--ifp-warn-bg);
  --mono:var(--ifp-mono); --sans:var(--ifp-font);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* ---------- top bar ---------- */
.bar{background:var(--ifp-bar-bg);color:var(--ifp-bar-text);display:flex;align-items:center;gap:14px;
     padding:0 18px;height:48px;position:sticky;top:0;z-index:20}
.bar .home{display:inline-flex;align-items:center;gap:8px;color:var(--ifp-bar-text);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
.bar .home svg{width:14px;height:14px;fill:#5fb6e6}
.bar .home:hover{color:#8fd0f3}
.bar .sep{color:var(--ifp-bar-muted)}
.bar .brand{font-size:13px;color:var(--ifp-bar-muted);white-space:nowrap}
.bar .nav{display:flex;gap:2px;align-items:center;min-width:0;overflow:hidden;margin-left:10px}
.bar .nav a{color:var(--ifp-bar-muted);text-decoration:none;font-size:12.5px;padding:5px 11px;border-radius:6px;white-space:nowrap}
.bar .nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.bar .nav a.here{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.bar .icao{font-family:var(--mono);font-weight:700;color:#5fb6e6;font-size:14px;padding-right:10px;border-right:1px solid var(--ifp-bar-line);margin-right:4px}
.bar .spacer{flex:1}
.bar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;font:inherit;border-radius:8px;
            font-size:12.5px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.12)}
.bar button.primary{background:var(--ifp-accent);border-color:var(--ifp-accent);color:#fff;font-weight:600}
.bar button.primary:hover{background:var(--ifp-accent-400);border-color:var(--ifp-accent-400)}
.bar button:disabled{opacity:.4;cursor:default}

main{padding:24px 28px 70px;max-width:1340px;margin:0 auto}

/* ---------- hub layout ---------- */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.hub .full{grid-column:1/-1}
.card{background:var(--panel);border-radius:8px;box-shadow:var(--ifp-card);overflow:hidden}
.card .hd{background:var(--ifp-navy);color:#fff;padding:9px 16px;font-size:11.5px;
          letter-spacing:.12em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line-soft);
          display:flex;align-items:center;gap:10px}
.card .hd .right{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:400;font-size:12px;color:#c9d3e6}
.card .bd{padding:14px 16px}
.card .bd.p0{padding:0}

.note{font-size:12.5px;color:var(--muted);margin:8px 0 12px;max-width:900px}
.note b{color:var(--ink);font-weight:500}
.mono{font-family:var(--mono)}

/* manifest inside survey card */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.meta .cell{padding:8px 12px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.meta .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta .v{font-family:var(--mono);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.meta .v.big{font-size:19px;font-weight:600;color:var(--head)}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:4px;
       background:var(--ifp-navy);color:#fff;text-transform:uppercase}

/* checks list */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:12px;align-items:baseline;padding:9px 16px;border-bottom:1px solid var(--line-soft);font-size:13px}
.checks li:last-child{border-bottom:none}
.checks .sev{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
             padding:1px 8px;border-radius:4px;flex:none;width:52px;text-align:center}
.sev.ok{background:var(--green-bg);color:var(--green)}
.sev.warn{background:var(--amber-bg);color:var(--amber)}
.sev.fail{background:var(--red-bg);color:var(--red)}
.checks .msg{min-width:0}
.checks a{color:var(--ifp-accent)}
.allclear{padding:20px 16px;color:var(--green);font-weight:500;font-size:13.5px}

/* verdict band */
.verdict{padding:14px 20px;border-left:6px solid;border-radius:0 8px 8px 0;font-family:var(--mono);margin-bottom:14px}
.verdict .word{font-size:22px;font-weight:800;letter-spacing:.06em}
.verdict .detail{font-size:12.5px;margin-top:3px}
.verdict.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.verdict.bad{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.verdict.warn{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}

/* runway cards */
.rwy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;padding:14px 16px}
.rwy-card{border:0;box-shadow:var(--ifp-card);border-radius:8px;overflow:hidden;background:var(--panel-2);cursor:pointer;text-align:left;color:inherit;
          font:inherit;padding:0;transition:box-shadow .12s}
.rwy-card:hover{box-shadow:var(--ifp-card-hover)}
.rwy-card .id{background:var(--ifp-accent-900);color:var(--head);font-family:var(--mono);font-weight:800;
              font-size:21px;padding:8px 14px;display:flex;align-items:center;gap:10px}
.rwy-card .id .ils{font-size:10px;letter-spacing:.08em;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:auto}
.ils.yes{background:var(--ifp-navy);color:#fff}
.ils.no{background:var(--auto-g-deep);color:#555}
.rwy-card .stats{padding:10px 14px;font-size:12.5px}
.rwy-card .stats .r{display:flex;justify-content:space-between;padding:2px 0}
.rwy-card .stats .r .l{color:var(--muted)}
.rwy-card .stats .r .v{font-family:var(--mono)}
.rwy-card .foot{border-top:1px solid var(--line-soft);padding:7px 14px;font-size:11.5px;font-family:var(--mono)}
.foot.ok{color:var(--green)} .foot.bad{color:var(--red)} .foot.quiet{color:var(--muted)}

h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ifp-navy);
   border-bottom:2px solid var(--ifp-navy);padding-bottom:8px;margin:26px 0 14px;font-weight:500}
h2:first-child{margin-top:0}

/* ---------- import zone ---------- */
.drop{display:block;border:1px dashed var(--line);border-radius:8px;background:var(--panel);padding:60px 30px;
      text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--ifp-accent);background:var(--ifp-accent-800)}
.drop .big{font-size:17px;font-weight:600;color:var(--head)}
.drop .small{font-size:12.5px;color:var(--muted);margin-top:6px}
.drop input{display:none}
.drop.mini{padding:14px}
.drop.mini .big{font-size:13px}
.err-log{font-family:var(--mono);font-size:12px;background:var(--red-bg);color:var(--red);
         border:1px solid var(--red);border-radius:6px;padding:10px 14px;margin:12px 0;white-space:pre-wrap}

/* ---------- tables ---------- */
table{border-collapse:collapse;background:var(--panel);font-size:12.5px}
th{background:var(--ifp-navy);color:#fff;font-weight:600;text-align:left;padding:6px 10px;
   font-size:11px;letter-spacing:.04em;white-space:nowrap;position:sticky;top:0;box-shadow:inset 0 -1px 0 var(--line-soft)}
td{border:1px solid var(--line-soft);padding:5px 10px;font-family:var(--mono);white-space:nowrap}
td.t{font-family:var(--sans)}
td.num{text-align:center}
td.in{background:var(--input-y)}
td.auto{background:var(--auto-g)}
td.chk-bad{color:var(--red);font-weight:700}
td.chk-ok{color:var(--green)}
td.gov{background:#F8CBAD !important}
tr:hover td{filter:brightness(.97)}
.tbl-wrap{overflow:auto;max-height:600px;border:1px solid var(--line-soft);border-radius:6px}
.tbl-wrap.auto-h{max-height:none}

/* key/value blocks */
.kv{border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;background:var(--panel);margin-bottom:18px}
.kv .row{display:grid;grid-template-columns:330px 180px 1fr;border-bottom:1px solid var(--line-soft)}
.kv .row:last-child{border-bottom:none}
.kv .k{padding:8px 14px;font-size:12.5px}
.kv .v{padding:8px 14px;font-family:var(--mono);font-size:13px;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
.kv .v.in{background:var(--input-y)} .kv .v.auto{background:var(--auto-g)}
.kv .c{padding:8px 14px;font-size:11.5px;color:var(--muted)}
.kv .hd2{grid-column:1/-1;background:var(--ifp-accent-900);color:var(--head);font-weight:500;font-size:11px;
        letter-spacing:.1em;text-transform:uppercase;padding:6px 14px}
.kv.compact .row{grid-template-columns:175px 145px 1fr}
.kv.compact .k{font-size:12px}
.kv input[type=number],.kv input[type=text]{width:100%;border:none;background:transparent;font:inherit;font-family:var(--mono);color:var(--ink);outline:none}
.kv .v.in:focus-within{background:var(--input-y-deep)}

select,input.cell-in{font:inherit;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line-soft);border-radius:4px;background:var(--input-y);color:var(--ink);padding:3px 5px}
input.cell-in{width:110px;text-align:center}
.legend{display:flex;gap:18px;font-size:11.5px;color:var(--muted);margin:6px 0 12px;align-items:center;flex-wrap:wrap}
.swatch{display:inline-block;width:13px;height:13px;border:1px solid var(--line);border-radius:2px;vertical-align:-2px;margin-right:5px}

button.act{background:var(--ifp-accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
button.act:hover{background:var(--ifp-accent-400)}
button.ghost{background:none;border:1px solid var(--line);border-radius:8px;color:var(--head);padding:7px 16px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
button.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
button:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}

.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px}
.pill.bad{background:var(--red-bg);color:var(--red)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}

.filter-row{margin:0 0 10px;display:flex;gap:14px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.filter-row input[type=text]{border:1px solid var(--line-soft);border-radius:4px;background:var(--ifp-field);color:var(--ink);padding:5px 8px;font:inherit;font-family:var(--mono);width:200px}
input[type=checkbox],input[type=radio]{accent-color:var(--ifp-accent)}

/* runway workspace */
.ws-head{display:flex;align-items:baseline;gap:16px;margin-bottom:16px}
.ws-head .rw{font-family:var(--mono);font-weight:800;font-size:34px;color:var(--head)}
.proc-list{list-style:none;margin:0;padding:0}
.proc-list li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-soft);font-size:13px}
.proc-list li:last-child{border-bottom:none}
.proc-list .nm{font-weight:500;min-width:260px}
.proc-list .st{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

.chip-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
label.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line-soft);border-radius:8px;
           background:var(--panel);padding:7px 14px;cursor:pointer;font-size:13px;user-select:none}
label.chip input{accent-color:var(--ifp-accent);margin:0}
label.chip.on{background:var(--input-y);border-color:var(--input-y-deep);font-weight:500}
label.chip:hover{border-color:var(--ifp-accent-600)}
.cfg-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.cfg-k:first-child{margin-top:0}

.seg-tabs{display:flex;gap:2px;border-bottom:1px solid var(--ifp-accent-700);margin:0 0 18px;flex-wrap:wrap}
.seg-tabs button{background:var(--panel-2);border:none;border-radius:6px 6px 0 0;color:var(--head);font:inherit;font-size:12.5px;
                 padding:8px 16px;cursor:pointer}
.seg-tabs button:hover{background:var(--ifp-accent-800)}
.seg-tabs button.on{background:var(--ifp-accent);color:#fff;font-weight:600}

.hidden{display:none}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

@media (max-width:900px){
  .hub{grid-template-columns:1fr}
  main{padding:14px}
  .bar{flex-wrap:wrap;height:auto;padding:8px 14px;gap:8px}
  .kv .row{grid-template-columns:1fr 1fr}
  .kv .c{grid-column:1/-1;padding-top:0}
}
:focus-visible{outline:2px solid var(--ifp-accent);outline-offset:1px}
</style>
</head>

<header class="bar">
  <a class="home" href="../index.html"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,120v96a8,8,0,0,1-8,8H160a8,8,0,0,1-8-8V164a4,4,0,0,0-4-4H108a4,4,0,0,0-4,4v52a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V120a16,16,0,0,1,4.69-11.31l80-80a16,16,0,0,1,22.62,0l80,80A16,16,0,0,1,224,120Z"/></svg>IFP Portal</a><span class="sep">/</span><span class="brand">IFP Design Calculator</span>
  <nav class="nav" id="nav"></nav>
  <span class="spacer"></span>
  <button id="btn-save" title="Save your declarations and decisions to a small project file">Save project</button>
  <button id="btn-load">Open project</button>
  <button class="primary" id="btn-export" title="Generate the CAA presentation workbook (.xlsx) from the current values">Export CAA workbook</button>
</header>

<main id="main"></main>

<input type="file" id="file-survey" accept=".csv,.xlsx,.xls" class="hidden">
<input type="file" id="file-project" accept=".json" class="hidden">

<script>
"use strict";
/* =====================================================================
   IFP DESIGN TOOL
   Survey import parses by CAP1732 App.5 FIELD POSITION (1-based):
     1 SITE · 2 TYPE · 3 IDENT · 4 ASSOC · 14 EASTING · 15 NORTHING
     16 VERT REF · 17 ORTHO (M) · 18 ORTHO (FT) · 24 REC ID · 25 SURVEY DATE
   Elevations are ORTHOMETRIC (AMSL), used AS SURVEYED — fields 17 and 18
   are the official point of truth; nothing is converted or re-derived.
   CAP1732 App.5 forbids commas within fields, so split(",") is safe for CSV.
   ===================================================================== */
const F = {SITE:1, TYPE:2, IDENT:3, ASSOC:4, EASTING:14, NORTHING:15,
           VERTREF:16, ORTHO_M:17, ORTHO_FT:18, RECID:24, SDATE:25};

/* ---- Survey codes (from the 9 reference surveys) ---- */
const BASE_CODES = [
 ["ARP","ARP","N",null,"EXCLUDED — surveyor's EGKK report: 'It is not the elevation at the ARP'. Not a runway-surface value. Set Y to reinstate."],
 ["AEP","AEP","N",null,"Aerodrome Elevation Point — the surveyor's declared value. Used as the COMPARATOR; excluded from the max to keep the check independent."],
 ["ASDA END","ASDA_END","Y",null,"Variant spelling. ASDA = TORA + stopway."],
 ["ASDA_END","ASDA_END","Y",null,"CAP1732 Table 1 — ASDA = TORA + stopway."],
 ["END_LDA","LDA_END","Y",null,"Variant spelling of LDA_END."],
 ["LDA END","LDA_END","Y",null,"Variant spelling of LDA_END."],
 ["LDA_END","LDA_END","Y",null,"CAP1732 Table 1."],
 ["CENTRE_PT_RWY","RWY_PROFILE","Y",null,"Runway surface profile points — these drive the max at most aerodromes."],
 ["OTHER:RUNWAY_LEVEL","RWY_PROFILE","Y",null,"Variant spelling of RWY_PROFILE."],
 ["PROFILE_PT","RWY_PROFILE","Y",null,"Variant spelling of RWY_PROFILE."],
 ["RWY_PROFILE","RWY_PROFILE","Y",null,"Runway surface profile points."],
 ["TDZE","TDZE","Y",null,"Touchdown zone elevation — a runway-surface point. Drives RWY 07 at EGGW."],
 ["THR","THR","Y",null,"CAP1732 Table 1 — threshold."],
 ["TORA END","TORA_END","Y",null,"Variant spelling."],
 ["TORA_END","TORA_END","Y",null,"CAP1732 Table 1."],
 ["TORA START","TORA_START","Y",null,"Variant spelling."],
 ["TORA_START","TORA_START","Y",null,"CAP1732 Table 1."],
 ["TODA END","TODA_END","Y",null,"INCLUDED at your request. TODA = TORA + CLEARWAY — beyond the pavement where a clearway exists (drives the EGKK max via 26L)."],
 ["TODA_END","TODA_END","Y",null,"INCLUDED at your request. TODA = TORA + CLEARWAY — beyond the pavement where a clearway exists."],
 ["EOC","EOC","N",null,"UNKNOWN code (EGPA). Would ADD 2.5 m at EGPA — needs your decision."],
 ["LLZ","LLZ","N","ANTENNA","LOCALIZER ANTENNA — used for THR→LLZ and to decide whether the runway has an ILS."],
 ["LLZ_I-EGN","LLZ_I-EGN","N","ANTENNA","Localizer antenna."],
 ["LLZ_I-EGT","LLZ_I-EGT","N","ANTENNA","Localizer antenna."],
 ["LOC","LOC","N","ANTENNA","Localizer antenna."],
 ["LLZ-GL","LLZ-GL","N","MONITOR","LLZ monitor/field kit — NOT the antenna."],
 ["LLZ_FFM1","LLZ_FFM1","N","MONITOR","LLZ monitor/field kit."],
 ["LLZ_FFM2","LLZ_FFM2","N","MONITOR","LLZ monitor/field kit."],
 ["LLZ_MON","LLZ_MON","N","MONITOR","LLZ monitor/field kit."],

 ...[

function crit(k){
  const d=CRIT_DEFS.find(x=>x.k===k);
  const v=safeNum((S.criteria||{})[k]);
  return v??(d?d.def:null);
}
function critCustomCount(){ return CRIT_DEFS.filter(x=>safeNum((S.criteria||{})[x.k])!=null&&safeNum(S.criteria[x.k])!==x.def).length; }
/* PANS-OPS Pt II S1 Ch1 App C constants (non-SI form of the formula) */
const OAS_CURV_K=0.8833;        // H = h + 6076·D·tanθ + 0.8833·D²
const OAS_FTNM=6076;            // formula literal — NOT the Annex 5 conversion
const RDH_ADJ_K=1.514e-4;       // ΔD constant
const FT_M=0.3048, NM_M=1852;   // ICAO Annex 5 — exact
/* ---- SIDs: common departure datum ---- */

const ILS_DEFAULTS={rdhCharted:"",rdhCal:"",calRef:"",rdhSource:"Charted",vpa:"",faf:""};

/* ILS final approach: FAF track length and FAP distance (earth curvature).
   Ported from the ILS_Final sheet, verified against its 08R/26L values.
   ΔD uses cot(θ) at the ACTUAL glide path angle per PANS-OPS App C. */
function ilsFinalCalc(thrFt,rdhOp,vpaDeg,fafAlt){
  if(thrFt==null||rdhOp==null||vpaDeg==null||fafAlt==null||!(vpaDeg>0)) return null;
  const th=vpaDeg*Math.PI/180, t=Math.tan(th), cot=1/t;
  // D · FAF — nominal descent from the RDH datum
  const hgt=fafAlt-thrFt-rdhOp;              // height of FAF above RDH datum (ft)
  const fafFt=hgt*cot, fafM=fafFt*FT_M, fafNM=fafM/NM_M;
  const fafChart=Math.ceil(fafNM*10-1e-9)/10;   // rounded UP to 0.1 NM (App C para 3 says nearest)
  // E · FAP — H = h + 6076·D·tanθ + 0.8833·D², solved for D with h = 50 ft
  const x=OAS_CURV_K, y=OAS_FTNM*t, z=crit("rdhStd")-(fafAlt-thrFt);
  const disc=y*y-4*x*z;
  if(disc<0) return null;
  const Dnm=(-y+Math.sqrt(disc))/(2*x), Dft=Dnm*OAS_FTNM;
  const dD=RDH_ADJ_K*OAS_FTNM*(crit("rdhStd")-rdhOp)*cot;  // RDH adjustment (ft)
  const fapFt=Dft+dD, fapM=fapFt*FT_M, fapNM=fapM/NM_M;   // final NM via Annex 5, not the App C literal
  return {tanTh:t,hgt,fafFt,fafM,fafNM,fafChart,x,y,z,Dnm,Dft,dD,fapFt,fapM,fapNM};
}

/* ============ ILS missed approach — Turn at Altitude (TNA) ============ */
/* Ported from the ILS_MA worksheet, formula for formula:
   SOC alt (ft)      = OCA − HL(m) ÷ 0.3048            (HL always in metres; Annex 5 exact)
   SOC from THR (m)  = −900 + (((OCA − THR elev)×0.3048) − HL) / tan(VPA)
   dist SOC→turn (m) = (turn alt − SOC alt) × 0.3048 / MACG
   dist THR→turn (m) = dist + |SOC| when SOC is before THR, else dist − SOC
   TAS (kt)          = IAS·171233·((288+temp)−0.00198·alt)^0.5/(288−0.00198·alt)^2.628 + tail wind
   c                 = 3 s reaction + 3 s transition, each (TAS/3600)×3×1852 m
   The OCA is entered PER GRADIENT — a steeper MACG changes the OAS, so each
   designed gradient has its own OCA set.                                        */
const K_TAS=171233, T0_K=288, LAPSE=1.98e-3, TAS_EXP=2.628;
const M_FT=1/FT_M;                          // metres → feet, Annex 5 exact (÷ 0.3048)
const MACG_OPTS=["3.0","3.5","4.0","4.5","5.0"];   // additional design gradients
const DEFAULT_MA={type:"TNA",
  designs:{C1:{on:true,oca:{},hl:{}},C2:{on:false,oca:{},hl:{}}},
  macgs:{},turns:[{alt:""}],temp:"",tailwind:"",speeds:{}};

function maGrads(ma){ return [crit("macgBase"),...MACG_OPTS.filter(g=>ma.macgs[g]).map(Number)].sort((a,b)=>a-b); }
function gradKey(g){ return g.toFixed(1).replace(".","_"); }
/* older saves held one OCA set (implicitly 2.5%) — lift it under the 2.5% key */
function migrateOca(dz){
  if(dz&&dz.oca&&["A","B","C","D"].some(c=>typeof dz.oca[c]==="string"||typeof dz.oca[c]==="number")){
    dz.oca={[gradKey(crit("macgBase"))]:dz.oca};
  }
}
function maTas(iasKt,altFt,temp,tailwind){
  return iasKt*K_TAS*Math.sqrt((T0_K+temp)-LAPSE*altFt)/Math.pow(T0_K-LAPSE*altFt,TAS_EXP)+tailwind;
}
/* One design (CAT I or CAT II): per-gradient, per-category SOC and climb distances */
function tnaCalc(thrFt,vpa,ma,designKey,cats){
  const dz=ma.designs[designKey];
  if(!dz||!dz.on) return null;
  if(vpa==null||!(vpa>0)) return {noVpa:true};
  if(thrFt==null) return {missing:true};
  migrateOca(dz);
  const grads=maGrads(ma);
  const t1=safeNum(ma.turns[0]&&ma.turns[0].alt);
  const temp=safeNum(ma.temp)??crit("isaDev"), tw=safeNum(ma.tailwind)??crit("maWind");
  const tanV=Math.tan(vpa*Math.PI/180);
  const byGrad=grads.map(g=>{
    const gk=gradKey(g);
    const perCat=cats.map(cat=>{
      const oca=safeNum(dz.oca?.[gk]?.[cat]);
      const hl=crit("hl_"+designKey+"_"+cat);    // Doc 8168 values via criteria — never edited per-procedure
      if(oca==null||hl==null) return {cat,missing:true};
      const socAlt=oca-hl*M_FT;
      const socThr=crit("socOffset")+(((oca-thrFt)*FT_M)-hl)/tanV;
      let dSoc=null,dThr=null;
      if(t1!=null&&t1>socAlt){
        dSoc=(t1-socAlt)*FT_M/(g/100);
        dThr=socThr<0?dSoc+Math.abs(socThr):dSoc-socThr;
      }
      return {cat,oca,hl,socAlt,socThr,dSoc,dThr};
    });
    return {g,gk,perCat};
  });
  const catParams=cats.map(cat=>{
    const ias=safeNum(ma.speeds[cat])??crit("ias_"+cat);
    const tas=t1!=null?maTas(ias,t1,temp,tw):null;
    const c3=tas!=null?(tas/3600)*3*NM_M:null;
    return {cat,ias,tas,c3,cTot:c3!=null?2*c3:null};
  });
  const hlByCat=cats.map(cat=>crit("hl_"+designKey+"_"+cat));
  return {grads,byGrad,catParams,hlByCat,t1,temp,tw};
}
/* Turns after the first: category-independent climb distances, plus TAS & c at each */
function tnaContinuation(ma,cats){
  const grads=maGrads(ma);
  const temp=safeNum(ma.temp)??crit("isaDev"), tw=safeNum(ma.tailwind)??crit("maWind");
  const alts=ma.turns.map(t=>safeNum(t.alt));
  const segs=[];
  for(let i=1;i<alts.length;i++){
    const ok=alts[i]!=null&&alts[i-1]!=null&&alts[i]>alts[i-1];
    segs.push({n:i+1,from:alts[i-1],to:alts[i],ok,
      perGrad:grads.map(g=>({g,d:ok?(alts[i]-alts[i-1])*FT_M/(g/100):null})),
      params:cats.map(cat=>{
        const ias=safeNum(ma.speeds[cat])??crit("ias_"+cat);
        const tas=alts[i]!=null?maTas(ias,alts[i],temp,tw):null;
        const c3=tas!=null?(tas/3600)*3*NM_M:null;
        return {cat,ias,tas,c3,cTot:c3!=null?2*c3:null};
      })});
  }
  return {grads,segs};
}

/* per-runway configuration with defaults; llzFound seeds ILS on first sight.
   cfg = {cats:{A..D}, procs:{ILS:true,...}, proc:{ILS:{rdh...}, LOC:{...}}} */
function getCfg(key,llzFound){
  const c=S.rwyCfg[key];
  if(c) return c;
  return {cats:{}, procs: llzFound?{ILS:true}:{}, proc:{}};
}
function ensureCfg(key){
  if(!S.rwyCfg[key]){
    const d=compute();
    const r=d&&d.runways.find(x=>x.key===key);
    S.rwyCfg[key]=JSON.parse(JSON.stringify(getCfg(key, r?r.llzFromSurvey:false)));
  }
  return S.rwyCfg[key];
}
function ensureProcCfg(key,procId){
  const c=ensureCfg(key);
  c.proc=c.proc||{};
  if(!c.proc[procId])
    c.proc[procId] = procId==="ILS" ? {...ILS_DEFAULTS, ...(c.ils||{})} : {};
  return c.proc[procId];
}

/* =============================== state =============================== */
const S = {
  loaded:false, fileName:"", icao:"", company:"", procDate:"", vertRef:"",
  points:[],
  tolMatch:0.005,               // aerodrome-elevation match tolerance (ft)
  manualAEP:"",                 // manual fallback where the survey has no AEP row
  codeOverrides:{},             // code -> "Y"/"N"
  rwyCfg:{},                    // runway -> {cats:{A..D}, procs:{ILS,LOC,...}, ils:{rdh...}} — preserved across reloads
  manualLlz:{},                 // runway -> {ident,e,n}
  criteria:{},                  // design-criteria overrides (blank = defaults)
  view:{name:"hub", rwy:null},
};

/* ============================ parsing ================================ */
function parseCsvText(text){
  const rows = text.split(/\r\n|\n|\r/).map(ln=>ln.split(",").map(s=>s.trim()));
  while(rows.length && rows[rows.length-1].every(c=>c==="")) rows.pop();
  return rows;
}
function parseXlsxBuffer(buf){
  const wb = XLSX.read(buf, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
  return aoa.map(r=>r.map(c=>String(c==null?"":c).trim()));
}
function cell(rows,r,c){ const row=rows[r-1]; return row&&row[c-1]!==undefined?String(row[c-1]).trim():""; }
function metaValue(rows,key){
  const n = Math.min(rows.length,30);
  for(let i=1;i<=n;i++){
    const c1 = cell(rows,i,1);
    const p = c1.toUpperCase().indexOf(key.toUpperCase());
    if(p>=0){
      let rest = c1.slice(p+key.length);
      if(rest.startsWith(":")) rest = rest.slice(1);
      rest = rest.trim();
      if(rest) return rest;
      const c2 = cell(rows,i,2);           // CSV variant: value in the next field
      if(c2) return c2;
    }
  }
  return "";
}
function findIcao(rows,fileName){
  const m = metaValue(rows,"AerodromeIdent").replace(/[:\t]/g," ").trim();
  if(m.length>=4) return m.slice(0,4).toUpperCase();
  const base = fileName.split(/[\\/]/).pop();
  if(base.length>=4) return base.slice(0,4).toUpperCase();
  return "";
}
function safeNum(s){
  const t=String(s??"").trim(); if(!t) return null;
  const v=Number(t.replace(/,/g,"")); return Number.isFinite(v)?v:null;
}
function normRwy(s){
  const t=String(s??"").toUpperCase().trim();
  let num="",suf="";
  for(const ch of t){ if(ch>="0"&&ch<="9") num+=ch; else if(ch>="A"&&ch<="Z") suf+=ch; }
  return num?String(parseInt(num,10)).padStart(2,"0")+suf:t;
}
function assocMatches(assoc,key){
  const a=String(assoc??"").trim(); if(!a) return false;
  if(a.includes("/")) return a.split("/").some(p=>normRwy(p)===key);
  return normRwy(a)===key;
}

function loadSurvey(rows, fileName){
  const icao = findIcao(rows,fileName);
  if(!icao) throw new Error("Could not determine the ICAO code (no AerodromeIdent metadata, and the filename does not start with 4 characters).");
  let maxCols=0; for(const r of rows) if(r.length>maxCols) maxCols=r.length;
  if(maxCols < F.SDATE)
    throw new Error(`This survey has only ${maxCols} columns; CAP1732 field ${F.SDATE} (SURVEY DATE) is expected. Nothing was imported.`);

  const company  = metaValue(rows,"DataOriginatorCompany");
  const procDate = metaValue(rows,"SurveyProcessDate");
  const points=[]; let vertRef="";
  for(let i=1;i<=rows.length;i++){
    if(cell(rows,i,F.SITE).toUpperCase()!==icao) continue;
    const type=cell(rows,i,F.TYPE); if(!type) continue;
    points.push({
      id:cell(rows,i,F.RECID)||("R"+(points.length+1)),
      code:type.toUpperCase(),
      assoc:cell(rows,i,F.ASSOC),
      e:safeNum(cell(rows,i,F.EASTING)),
      n:safeNum(cell(rows,i,F.NORTHING)),
      elevM:safeNum(cell(rows,i,F.ORTHO_M)),    // field 17 — as surveyed
      elevFt:safeNum(cell(rows,i,F.ORTHO_FT)),  // field 18 — as surveyed, governs
      ident:cell(rows,i,F.IDENT),
      sdate:cell(rows,i,F.SDATE).slice(0,10),
    });
    if(!vertRef) vertRef=cell(rows,i,F.VERTREF);
  }
  if(points.length===0)
    throw new Error(`No data rows found for ${icao}. Expected column 1 of each data row to contain '${icao}'.`);

  S.loaded=true; S.fileName=fileName; S.icao=icao; S.company=company;
  S.procDate=procDate; S.vertRef=vertRef; S.points=points;
  S.codeOverrides={};
  // rwyCfg and manualLlz survive on purpose — configuration follows its runway
  // across a reload; a different aerodrome has different keys, so nothing leaks.
}

/* ====================== derived calculations ========================= */
function codeInfo(code){
  const base=CODES.get(code);
  const include=S.codeOverrides[code] ?? (base?base.include:"?");
  return {known:!!base, include, llz:base?base.llz:null, canon:base?base.canon:code, note:base?base.note:""};
}
function compute(){
  if(!S.loaded) return null;
  const pts=S.points.map(p=>{
    const ci=codeInfo(p.code);
    const gM=p.elevM??(p.elevFt!=null?p.elevFt*FT_M:null);   // governing SURVEYED METRES (field 17; ft fallback only if m absent)
    return {...p, include:ci.include, llz:ci.llz, known:ci.known, gM,
            inclM:(ci.include==="Y"&&gM!=null)?gM:null};
  });
  const aepRow=pts.find(p=>codeInfo(p.code).canon==="AEP"&&p.gM!=null);
  const aepFile=aepRow?aepRow.gM:null;                       // metres
  const manual=safeNum(S.manualAEP);
  const effective=manual!=null?manual:aepFile;

  let maxP=null;
  for(const p of pts) if(p.inclM!=null&&(maxP===null||p.inclM>maxP.inclM)) maxP=p;
  const included=pts.filter(p=>p.inclM!=null).length;

  const unk=new Map();
  for(const p of pts) if(!p.known&&!(p.code in S.codeOverrides)) unk.set(p.code,(unk.get(p.code)||0)+1);

  let diff=null,status="—",statusClass="warn";
  if(effective!=null&&maxP){
    diff=maxP.inclM-effective;
    if(Math.abs(diff)<=S.tolMatch){status="MATCH";statusClass="ok";}
    else{
      status=`DIFFERS: computed value ${diff>0?"HIGHER":"LOWER"} by ${Math.abs(diff).toFixed(3)} m `+
             `(${(Math.abs(diff)/FT_M).toFixed(2)} ft) via ${maxP.code} ${maxP.assoc||"—"}`;
      statusClass="diff";
    }
  }else if(!maxP){status="no included points — check the survey codes";}
  else{status="AEP not in file — enter the surveyor's report value";}

  // operative value (METRES): the MOST CONSERVATIVE (higher) of the surveyor's
  // AEP and our computed value — this is what feeds every calculation.
  // We work in metres; published ft are derived ÷ 0.3048 (Annex 5).
  let operative=null, operativeSrc="—";
  const compMax=maxP?maxP.inclM:null;
  if(effective!=null&&compMax!=null){
    if(compMax>=effective){operative=compMax;operativeSrc=compMax===effective?"both equal":"computed from survey";}
    else{operative=effective;operativeSrc="surveyor's AEP";}
  }else if(compMax!=null){operative=compMax;operativeSrc="computed from survey (no AEP)";}
  else if(effective!=null){operative=effective;operativeSrc="surveyor's AEP (no included points)";}

  const runways=[];
  for(const p of pts) if(p.code==="THR"){
    const key=normRwy(p.assoc);
    let llz=null;
    if(key) llz=pts.find(q=>q.llz==="ANTENNA"&&assocMatches(q.assoc,key))||null;
    const man=S.manualLlz[key]||null;
    const llzId=llz?(llz.ident||llz.id):(man?man.ident:"");
    const llzE=llz?llz.e:(man?safeNum(man.e):null);
    const llzN=llz?llz.n:(man?safeNum(man.n):null);
    const dist=(llzE!=null&&llzN!=null&&p.e!=null&&p.n!=null)?Math.hypot(llzE-p.e,llzN-p.n):null;
    const thrM=p.gM;                                  // surveyed metres — the working value
    const thrFt=thrM!=null?thrM/FT_M:null;            // published ft, derived (Annex 5)
    const cfg=getCfg(key,!!llz);
    const procsOn=PROC_TYPES.filter(([id])=>cfg.procs[id]).map(([id])=>id);
    const catsOn=CATS.filter(c=>cfg.cats[c]);
    const ilsOn=!!cfg.procs.ILS, locOn=!!cfg.procs.LOC;
    const needLlz=ilsOn||locOn;
    const ils=ilsOn?"YES":"NO";
    let llzCheck="";
    if(needLlz&&dist==null) llzCheck=(ilsOn?"ILS":"LOC")+" declared but no LLZ — enter one";
    else if(!needLlz&&dist!=null) llzCheck="LLZ present but no ILS/LOC declared — check";
    else if(!needLlz) llzCheck="no ILS/LOC";
    else llzCheck=dist>1000?"ok":"LLZ too close — check";
    // ILS configuration derived values (per-procedure store; legacy cfg.ils honoured)
    const ic={...ILS_DEFAULTS, ...(cfg.ils||{}), ...((cfg.proc&&cfg.proc.ILS)||{})};
    const rdhCharted=safeNum(ic.rdhCharted), rdhCal=safeNum(ic.rdhCal);
    const rdhSource=ic.rdhSource||"Charted";
    const rdhOperative=rdhSource==="Calibration"?(rdhCal??rdhCharted):(rdhCharted??rdhCal);
    const rdhDiff=(rdhCharted!=null&&rdhCal!=null)?rdhCal-rdhCharted:null;
    const rdhCheck=rdhDiff==null?"":(Math.abs(rdhDiff)<1e-9?"MATCH":"DIFFERS");
    const vpa=safeNum(ic.vpa);
    let vpaCheck="";
    if(vpa!=null){
      if(vpa<crit("vpaMin")) vpaCheck=`below minimum ${crit("vpaMin")}°`;
      else if(vpa>crit("vpaMax")) vpaCheck=`above maximum ${crit("vpaMax")}°`;
      else if(Math.abs(vpa-crit("vpaOpt"))<1e-9) vpaCheck="optimum";
      else vpaCheck="ok";
    }
    const faf=safeNum(ic.faf);
    const finalCalc=ilsOn?ilsFinalCalc(thrFt,rdhOperative,vpa,faf):null;
    let rMax=null;
    for(const q of pts) if(q.inclM!=null&&assocMatches(q.assoc,key))
      if(rMax===null||q.inclM>rMax.inclM) rMax=q;
    /* SID datum: position = TODA_END; elevation = the HIGHER of TODA_END / TORA_END.
       Manual fallback lives in cfg.sidCommon when the survey lacks the records. */
    const toda=pts.find(q=>codeInfo(q.code).canon==="TODA_END"&&assocMatches(q.assoc,key))||null;
    const tora=pts.find(q=>codeInfo(q.code).canon==="TORA_END"&&assocMatches(q.assoc,key))||null;
    const sc=cfg.sidCommon||{};
    let sidElev=null,sidElevSrc="—";
    const te=toda?toda.gM:null, re=tora?tora.gM:null;   // surveyed metres
    if(te!=null&&re!=null){
      sidElev=Math.max(te,re);
      sidElevSrc=te===re?"TODA_END = TORA_END":(te>re?"TODA_END (higher)":"TORA_END (higher)");
    }else if(te!=null){sidElev=te;sidElevSrc="TODA_END (no TORA_END in survey)";}
    else if(re!=null){sidElev=re;sidElevSrc="TORA_END (no TODA_END in survey)";}
    else if(safeNum(sc.manElev)!=null){sidElev=safeNum(sc.manElev);sidElevSrc="manual entry";}
    const sid={toda,tora,
      e:toda?toda.e:safeNum(sc.manE), n:toda?toda.n:safeNum(sc.manN),
      elevM:sidElev, elevFt:sidElev!=null?sidElev/FT_M:null,   // m governs; ft derived for published altitudes
      elevSrc:sidElevSrc, fromSurvey:!!(toda||tora)};
    runways.push({key,thr:p,thrM,thrFt,llzFromSurvey:!!llz,llzId,llzE,llzN,dist,ils,llzCheck,
                  cfg,ic,procsOn,catsOn,ilsOn,locOn,needLlz,
                  rdhCharted,rdhCal,rdhSource,rdhOperative,rdhDiff,rdhCheck,vpa,vpaCheck,faf,finalCalc,
                  sid,rwyMax:rMax,ref:`${S.icao} rec ${p.id} | surveyed ${p.sdate}`});
  }
  return {pts,aepFile,manual,effective,maxP,included,total:pts.length,
          unk,diff,status,statusClass,operative,operativeSrc,runways};
}

/* every outstanding item in one place — replaces the scattered Excel checks */
function buildChecks(d){
  const list=[];
  if(!d) return list;
  // SIDs whose first turn falls before the minimum first-turn distance
  for(const r of d.runways){
    const minc=sidCommonCalc(r,d);
    if(!minc||minc.need) continue;
    for(const pid of ["SIDC","SIDPBN"]){
      const sids=(r.cfg.proc&&r.cfg.proc[pid]&&r.cfg.proc[pid].sids)||[];
      sids.forEach(s=>{
        const t1=safeNum(s.turns&&s.turns[0]&&s.turns[0].dist);
        if(t1!=null&&t1<minc.distM-1e-9)
          list.push({sev:"warn",msg:`SID ${s.name||"(unnamed)"} — ${r.key} ${pid==="SIDC"?"Conventional":"PBN"}: first turn ${t1.toFixed(2)} m is ${(minc.distM-t1).toFixed(2)} m BEFORE the minimum first-turn distance ${minc.distM.toFixed(2)} m`,
                     go:`proc:${r.key}:${pid}`});
      });
    }
  }
  // aerodrome elevation
  if(d.statusClass==="ok")
    list.push({sev:"ok",msg:`Aerodrome elevation: MATCH — surveyor ${f3(d.effective)} m vs computed ${f3(d.maxP.inclM)} m (tolerance ${S.tolMatch} m)`,go:"elev"});
  else if(d.statusClass==="diff")
    list.push({sev:"warn",msg:`Aerodrome elevation: ${d.status} — the more conservative value ${f3(d.operative)} m (${d.operativeSrc}) is carried forward`,go:"elev"});
  else
    list.push({sev:"warn",msg:`Aerodrome elevation: ${d.status}`,go:"elev"});
  // unknown codes
  if(d.unk.size)
    list.push({sev:"fail",msg:`${d.unk.size} unrecognised survey code(s): ${[...d.unk.keys()].join(", ")} — decide Y/N or those points are silently excluded from the max`,go:"codes"});
  else
    list.push({sev:"ok",msg:"All survey codes recognised"});
  // runways
  if(!d.runways.length)
    list.push({sev:"fail",msg:"No THR records found — no runways could be built"});
  for(const r of d.runways){
    if(r.llzCheck==="ok") list.push({sev:"ok",msg:`RWY ${r.key}: localizer ${r.llzId} at ${f2(r.dist)} m — ok`,go:"rwy:"+r.key});
    else if(r.llzCheck==="no ILS/LOC") list.push({sev:"ok",msg:`RWY ${r.key}: no ILS/LOC declared`,go:"rwy:"+r.key});
    else list.push({sev:"warn",msg:`RWY ${r.key}: ${r.llzCheck}`,go:"rwy:"+r.key});
    if(r.ilsOn){
      if(r.vpaCheck.startsWith("below")||r.vpaCheck.startsWith("above"))
        list.push({sev:"warn",msg:`RWY ${r.key}: glide path ${r.vpa}° is ${r.vpaCheck}`,go:"rwy:"+r.key});
      if(r.rdhCheck==="DIFFERS")
        list.push({sev:"warn",msg:`RWY ${r.key}: RDH calibration differs from charted by ${r.rdhDiff.toFixed(2)} ft — source in use: ${r.rdhSource}`,go:"rwy:"+r.key});
    }
    if(r.procsOn.length&&!r.catsOn.length)
      list.push({sev:"warn",msg:`RWY ${r.key}: procedures declared but no aircraft category selected`,go:"rwy:"+r.key});
  }
  return list;
}

/* ============================ formatting ============================= */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f3=v=>v==null?"":v.toFixed(2);
const f2=v=>v==null?"":v.toFixed(2);

/* ============================ views ================================== */
function go(view,rwy,proc,seg){
  S.view={name:view,rwy:rwy||null,proc:proc||null,seg:seg||null};
  try{ history.pushState(S.view,""); }catch(e){}
  render(); window.scrollTo(0,0);
}
function goCheck(target){
  if(!target) return;
  if(target.startsWith("proc:")){const [,rwy,pid]=target.split(":");go("proc",rwy,pid,"config");}
  else if(target.startsWith("rwy:")) go("rwy",target.slice(4));
  else go(target);
}

function render(){
  const d=compute();
  renderNav(d);
  document.getElementById("btn-export").disabled=!d;
  document.getElementById("btn-save").disabled=!d;
  const m=document.getElementById("main");
  if(!d){ m.innerHTML=viewWelcome(); wireImport(); return; }
  switch(S.view.name){
    case "elev":   m.innerHTML=viewElev(d);   wireElev(); break;
    case "points": m.innerHTML=viewPoints(d); wirePoints(); break;
    case "codes":  m.innerHTML=viewCodes(d);  wireCodes(); break;
    case "crit":   m.innerHTML=viewCrit();     wireCrit(); break;
    case "rwy":    m.innerHTML=viewRunway(d,S.view.rwy); wireRunway(); break;
    case "proc":   m.innerHTML=viewProc(d,S.view.rwy,S.view.proc,S.view.seg); wireProc(); break;
    default:       m.innerHTML=viewHub(d);    wireHub(); break;
  }
  autosave();
}
function renderNav(d){
  const nav=document.getElementById("nav");
  if(!d){ nav.innerHTML=""; return; }
  const items=[["hub","Dashboard"]];
  const procLabel=id=>PROC_TYPES.find(([p])=>p===id)?.[1]||id;
  const pageNames={elev:"Aerodrome elevation",points:"Survey points",codes:"Survey codes",crit:"Design criteria"};
  let tail="";
  if(pageNames[S.view.name]) tail=`<a href="#" class="here">${pageNames[S.view.name]}</a>`;
  if(S.view.name==="rwy") tail=`<a href="#" class="here">RWY ${esc(S.view.rwy)}</a>`;
  if(S.view.name==="proc") tail=
    `<a href="#" data-rwyback="${esc(S.view.rwy)}">RWY ${esc(S.view.rwy)}</a>`+
    `<a href="#" class="here">${esc(procLabel(S.view.proc))}</a>`;
  nav.innerHTML = `<span class="icao">${esc(S.icao)}</span>` +
    items.map(([v,label])=>`<a href="#" data-nav="${v}" class="${S.view.name===v?"here":""}">${label}</a>`).join("") + tail;
  nav.querySelectorAll("[data-nav]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.nav);}));
  nav.querySelectorAll("[data-rwyback]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go("rwy",a.dataset.rwyback);}));
}

function wireImport(){
  const drop=document.getElementById("drop");
  if(drop){

/* ---------- ILS missed approach (TNA) view ---------- */
function getMaView(r){
  const saved=r.ic.ma||{};
  const ma=JSON.parse(JSON.stringify(DEFAULT_MA));
  ma.type=saved.type||ma.type;
  ma.temp=saved.temp??ma.temp; ma.tailwind=saved.tailwind??ma.tailwind;
  ma.macgs=saved.macgs||{}; ma.speeds=saved.speeds||{};
  ma.designs={C1:{on:true,oca:{},hl:{},...JSON.parse(JSON.stringify(saved.designs?.C1||{}))},
              C2:{on:false,oca:{},hl:{},...JSON.parse(JSON.stringify(saved.designs?.C2||{}))}};
  for(const k of ["C1","C2"]){
    ma.designs[k].oca=ma.designs[k].oca||{}; ma.designs[k].hl=ma.designs[k].hl||{};
    migrateOca(ma.designs[k]);
  }
  ma.turns=(saved.turns&&saved.turns.length)?saved.turns:[{alt:""}];
  return ma;
}
function viewIlsMA(r){
  const ma=getMaView(r);
  const cats=r.catsOn;
  const designMeta=[["C1","CAT I"],["C2","CAT II"]];
  if(!cats.length) return `<div class="card"><div class="bd"><p class="note" style="margin:0">
    Select the aircraft categories on the runway page first — the missed approach is calculated per category.</p></div></div>`;

  const calc={C1:tnaCalc(r.thrFt,r.vpa,ma,"C1",cats),
              C2:tnaCalc(r.thrFt,r.vpa,ma,"C2",cats)};
  // governing values per gradient — the SINGLE most conservative value across ALL
  // categories and both designs (one construction protects every category):
  // lowest SOC altitude · earliest SOC from THR · greatest THR→turn distance
  const gov={soc:{},socThr:{},dist:{}};
  for(const[k]of designMeta){const c=calc[k];if(!c||c.noVpa||c.missing||!c.byGrad)continue;
    c.byGrad.forEach(bg=>bg.perCat.forEach(pc=>{
      if(pc.missing)return;
      const upd=(m,val,better)=>{
        if(val==null)return;

function wireIlsMA(key){
  const getMa=()=>{
    const pc=ensureProcCfg(key,"ILS");
    if(!pc.ma) pc.ma=JSON.parse(JSON.stringify(DEFAULT_MA));
    pc.ma.designs=pc.ma.designs||{};
    for(const k of ["C1","C2"]){
      pc.ma.designs[k]=pc.ma.designs[k]||JSON.parse(JSON.stringify(DEFAULT_MA.designs[k]));
      pc.ma.designs[k].oca=pc.ma.designs[k].oca||{};
      pc.ma.designs[k].hl=pc.ma.designs[k].hl||{};
      migrateOca(pc.ma.designs[k]);
    }
    if(!pc.ma.turns||!pc.ma.turns.length) pc.ma.turns=[{alt:""}];
    pc.ma.macgs=pc.ma.macgs||{}; pc.ma.speeds=pc.ma.speeds||{};
    return pc.ma;
  };
  const setPath=(o,path,val)=>{const ks=path.split(".");for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]];}o[ks[ks.length-1]]=val;};
  document.querySelectorAll(".ma-cell,.ma-env").forEach(inp=>inp.addEventListener("change",e=>{
    setPath(getMa(),e.target.dataset.path,e.target.value); render();}));
  document.querySelectorAll(".ma-dz").forEach(c=>c.addEventListener("change",e=>{
    getMa().designs[e.target.dataset.dz].on=e.target.checked; render();}));
  document.querySelectorAll(".ma-type").forEach(c=>c.addEventListener("change",e=>{
    getMa().type=e.target.dataset.t; render();}));
  document.querySelectorAll(".ma-macg").forEach(c=>c.addEventListener("change",e=>{
    getMa().macgs[e.target.dataset.g]=e.target.checked; render();}));
  document.querySelectorAll(".ma-turn").forEach(inp=>inp.addEventListener("change",e=>{
    getMa().turns[+e.target.dataset.i].alt=e.target.value; render();}));
  document.querySelectorAll(".ma-delturn").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); getMa().turns.splice(+e.target.dataset.i,1); render();}));
  const add=document.getElementById("ma-addturn");
  if(add) add.addEventListener("click",()=>{getMa().turns.push({alt:""}); render();});
  document.querySelectorAll(".ma-speedcell").forEach(inp=>inp.addEventListener("change",e=>{
    getMa().speeds[e.target.dataset.cat]=e.target.value; render();}));
}
/* ---------- ILS advisory altitudes ---------- */
/* From the Advisory_Altitudes worksheet, formula for formula:
   exact alt (ft)       = ROUNDUP( ((D×1852)×tanθ + RDH_m) ÷ 0.3048 + THR_ft, 0 )   with height above THR in brackets
   for publication (ft) = same, ROUND to the nearest 10 ft
   FPM                  = ROUND( (GS/60 × 6076) × tanθ, −1 )
   Columns run from ceil(FAF distance NM) down toward the THR; the advisory
   altitude is never published below the OCA.                                    */
const ADV_FPM_SPEEDS=["160","140","120","100","80"];
function advCalc(r,ma){
  if(r.vpa==null||!(r.vpa>0)) return {need:"glide path angle (Final approach tab)"};
  if(r.rdhOperative==null) return {need:"RDH (Final approach tab)"};
  if(!r.finalCalc) return {need:"FAF procedure altitude (Final approach tab)"};
  const tan=Math.tan(r.vpa*Math.PI/180);
  const rdhM=r.rdhOperative*FT_M;
  const thr=Math.round(r.thrFt);               // published ft from surveyed metres, rounded to 1 ft as the worksheet does
  const start=Math.ceil(r.finalCalc.fafNM-1e-9);
  // OCA floor: highest 2.5% CAT I OCA across categories (one advisory column serves all)
  let autoFloor=null;
  const oca25=ma?.designs?.C1?.oca?.[gradKey(crit("macgBase"))]||{};
  for(const v of Object.values(oca25)){const n=safeNum(v); if(n!=null&&(autoFloor==null||n>autoFloor)) autoFloor=n;}
  const cols=[];
  for(let D=start;D>=1;D--){
    const raw=((D*NM_M)*tan+rdhM)*M_FT+thr;
    const exact=Math.ceil(raw-1e-9), pub=Math.round(raw/10)*10;
    cols.push({D,exact,exactH:exact-thr,pub,pubH:pub-thr});
  }
  return {tan,rdhM,thr,start,autoFloor,cols};
}
function viewIlsAdv(r,d){

        ${row("Aerodrome elevation (ft)",shown.map(()=>`<td class="num auto">${d.operative!=null?Math.round(d.operative/FT_M):"—"}</td>`).join(""),"Operative value (surveyed m ÷ 0.3048) — reference only.")}
        ${row("Altitude above MSL (ft) — exact",shown.map(col=>`<td class="num auto">${col.exact}(${col.exactH})</td>`).join(""),"Rounded UP to 1 ft; height above THR in brackets.")}
        ${row("Altitude (ft) — for publication",shown.map(col=>belowFloor(col)
            ?`<td class="num auto chk-bad">below OCA</td>`

        ${row("Published value (current chart)",shown.map(col=>belowFloor(col)

        ${row("Difference",shown.map(diffCell).join(""),"For publication − published.")}

        ${adv.speeds.map(s=>{const gs=safeNum(s);
          return `<td class="num auto">${gs!=null?Math.round((gs/60*OAS_FTNM)*c.tan/10)*10:"—"}</td>`;}).join("")}</tr></tbody>
    </table></div>
    <p class="note" style="margin:8px 0 0">FPM = (GS ÷ 60 × ${OAS_FTNM}) × gradient, rounded to 10.</p></div>
  </div>`;
  const floorCard=`
  <div class="card">
    <div class="hd">OCA floor</div>
    <div class="bd"><div class="kv compact" style="margin-bottom:0">
      <div class="row"><div class="k">Auto — highest 2.5% CAT I OCA</div>
        <div class="v auto">${c.autoFloor!=null?f2(c.autoFloor):"— enter OCAs on the Missed approach tab"}</div>
        <div class="c">One advisory column serves all categories, so the highest OCA governs.</div></div>
      <div class="row"><div class="k">Override (ft)</div>
        <div class="v in"><input type="number" step="1" id="adv-floor" value="${esc(adv.ocaFloor)}"></div>
        <div class="c">Leave blank to use the auto value.</div></div>

}

/* ---------- SIDs: common departure datum & minimum first turn ---------- */
/* Datum position = TODA_END; datum elevation = higher of TODA_END / TORA_END.
   Minimum turn altitude (TNA) defaults to aerodrome elevation + 500 ft.
   Minimum distance to the first turn: climb from 5 m above the DER elevation
   at 3.3% until reaching the TNA. Common to every SID on the runway end.     */
function sidCommonCalc(r,d){
  const sc=r.cfg.sidCommon||{};
  const tnaDefault=d.operative!=null?d.operative/FT_M+crit("tnaAbove"):null;   // aerodrome m → published ft, + increment
  const tna=safeNum(sc.tna)??tnaDefault;
  if(r.sid.elevM==null) return {need:"DER elevation (no TODA_END / TORA_END in the survey — enter it manually)",tna,tnaDefault};
  if(tna==null) return {need:"minimum turn altitude (no aerodrome elevation yet — enter the TNA manually)",tna,tnaDefault};
  const originM=r.sid.elevM+crit("sidDerH");          // climb origin, METRES — surveyed DER + 5 m, no conversion
  const originFt=originM/FT_M;                        // published ft (Annex 5)
  if(!(tna*FT_M>originM)) return {need:"a TNA above the climb origin",tna,tnaDefault,originM,originFt};
  const distM=(tna*FT_M-originM)/(crit("sidPdg")/100);   // all in metres: (TNA m − origin m) ÷ gradient
  return {tna,tnaDefault,originM,originFt,distM,distNM:distM/NM_M};
}
/* Individual SIDs: sequential turns climbing at the SID's gradient from the
   climb origin (DER + 5 m). Each turn: entered distance (from the previous
   turn), computed altitude, capped at the altitude restriction if that is
   LOWER; later turns climb on from the ACTUAL (capped) altitude.
   Value C = 6 s of flight at TAS(IAS, actual altitude, ISA+15) + 30 kt wind. */
function sidCalc(r,sid,minDistM){
  if(r.sid.elevM==null) return {need:"DER elevation"};
  const g=safeNum(sid.pdg)??crit("sidPdg");
  if(!(g>0)) return {need:"a valid climb gradient"};
  const origin=(r.sid.elevM+crit("sidDerH"))/FT_M;   // (surveyed m + 5 m) → ft, since published altitudes are ft
  const sidCats=CATS.filter(cat=>(sid.cats?sid.cats[cat]:r.cfg.cats[cat]));
  const ts=sid.turns||[];
  const rtype=t=>t.rtype||(String(t.restrict??"").trim()?"le":"none");  // older saves: a bare value meant at-or-below
  /* A SID cannot descend, so every AT-OR-BELOW / AT constraint also ceilings
     every EARLIER turn. ceil[i] = lowest such restriction at turn i or later. */
  const ceil=new Array(ts.length).fill(null);
  let run=null;
  for(let i=ts.length-1;i>=0;i--){
    const rr=safeNum(ts[i].restrict), ty=rtype(ts[i]);
    if(rr!=null&&(ty==="le"||ty==="eq")) run=run==null?rr:Math.min(run,rr);
    ceil[i]=run;
  }
  let prevAlt=origin, cum=0;
  const turns=ts.map((t,i)=>{
    const dist=safeNum(t.dist), restrict=safeNum(t.restrict);
    const ty=rtype(t);
    let computed=null, actual=null, capped=false, capBy=null, belowMin=false;
    let beforeMin=false, shortBy=null;
    if(i===0&&dist!=null&&minDistM!=null&&dist<minDistM-1e-9){beforeMin=true;shortBy=minDistM-dist;}
    if(dist!=null&&dist>=0){
      cum+=dist;
      computed=prevAlt+dist*(g/100)*M_FT;      // climb over the segment, m → ft (Annex 5)
      actual=computed;
      if(ceil[i]!=null&&actual>ceil[i]){
        actual=ceil[i]; capped=true;
        capBy=(restrict!=null&&(ty==="le"||ty==="eq")&&restrict===ceil[i])?"own":"later";
      }
      // at-or-above / at: the design gradient must actually get there
      if(restrict!=null&&(ty==="ge"||ty==="eq")&&computed<restrict-1e-9) belowMin=true;
      prevAlt=actual;
    }
    /* speeds: per declared category. Default = final MA IAS × departure factor;
       an entered per-turn limit reduces it, but must not fall below
       intermediate MA IAS × the same factor — flagged where it does. */
    const limit=safeNum(t.limit??t.ias);   // older saves stored a single ias — read as the limit
    const perCat=(actual!=null)?sidCats.map(cat=>{
      const f=crit("sidMassF");
      const def=crit("ias_"+cat)*f, minAllow=crit("iasInt_"+cat)*f;
      let ias=def, limited=false, belowSpeed=false;
      if(limit!=null){
        if(limit<def){ias=limit;limited=true;}
        if(limit<minAllow-1e-9) belowSpeed=true;
      }
      const tas=maTas(ias,actual,crit("isaDev"),crit("sidWind"));
      return {cat,def,minAllow,ias,limited,belowSpeed,tas,cM:tas/3600*crit("sidCSec")*NM_M};
    }):[];
    return {n:i+1,name:t.name||"",dist,cum:dist!=null?cum:null,limit,restrict,rtype:ty,
            computed,actual,capped,capBy,belowMin,beforeMin,shortBy,perCat};
  });
  return {g,origin,turns,minDistM:minDistM??null,cats:sidCats};
}

/* The SID page: the common datum block, then this type's SIDs.
   Results render only after Calculate — the constraint logic reads the whole
   SID (later at-or-below/at restrictions ceiling earlier turns), so partial
   input would show misleading caps. A hash of the inputs marks staleness. */
function sidHash(r,sid){ return JSON.stringify([sid.pdg,sid.turns,sid.cats??r.cfg.cats??null,r.sid.elevM,(r.cfg.sidCommon||{}).tna??"",S.criteria||{}]); }
const SID_RTYPES=[["none","—"],["ge","≥ at or above"],["le","≤ at or below"],["eq","= at"]];

        <td class="num in"><input type="number" step="1" class="sidp-turn cell-in" data-si="${si}" data-ti="${ti}" data-f="limit" value="${esc(tt.limit??tt.ias??"")}" placeholder="—" style="width:70px"></td>

          <select class="sidp-turn cell-in" data-si="${si}" data-ti="${ti}" data-f="rtype" style="width:64px;background:var(--input-y)">

        </td>
        ${res(ti,"computed",t=>`<td class="num auto">${t.computed!=null?t.computed.toFixed(2):"—"}</td>`)}
        ${res(ti,"actual",t=>`<td class="num auto ${t.capped?"gov":""} ${t.belowMin?"chk-bad":""}">${
            t.actual!=null?`<b>${t.actual.toFixed(2)}</b>${t.capped?(t.capBy==="later"?" (capped by later constraint)":" (capped)"):""}${t.belowMin?" — gradient cannot meet the ≥ restriction":""}`:"—"}</td>`)}
        <td class="t">${(sid.turns||[]).length>1?`<a href="#" class="sidp-delturn" data-si="${si}" data-ti="${ti}">remove</a>`:""}</td>

    return `<div class="card full">${head}
      <div class="bd">

            return `<label class="chip ${on?"on":""}"><input type="checkbox" class="sidp-cat" data-si="${si}" data-cat="${cat}"${on?" checked":""}>${cat}</label>`;}).join("")}

            <div class="c">The specified climb rate for this SID — blank uses the standard ${crit("sidPdg")}%.</div></div>

        </div>

          <tbody>${rows}</tbody></table></div>
        ${c&&c.cats&&c.cats.length?`
        <div class="cfg-k" style="margin-top:12px">Speeds & value C — per category</div>
        <div class="tbl-wrap auto-h"><table>
          <thead><tr><th>Turn</th><th></th>${c.cats.map(cat=>`<th>CAT ${cat}</th>`).join("")}</tr></thead>
          <tbody>${c.turns.flatMap(t=>t.perCat.length?[
            `<tr><td class="in" rowspan="3">TP${t.n}${t.actual!=null?" @ "+t.actual.toFixed(2)+" ft":""}${t.limit!=null?`<div class="mono" style="font-size:10.5px;color:#B45309">limit ${t.limit} kt</div>`:""}</td>
                 <td class="t">IAS (kt)</td>${t.perCat.map(p=>`<td class="num auto ${p.belowSpeed?"chk-bad":""}">${p.ias.toFixed(2)}${p.limited?" (limited)":""}${p.belowSpeed?`<div style="font-size:10.5px">below min ${p.minAllow.toFixed(2)}</div>`:""}</td>`).join("")}</tr>`,
            `<tr><td class="t">TAS + ${crit("sidWind")} kt</td>${t.perCat.map(p=>`<td class="num auto">${p.tas.toFixed(2)}</td>`).join("")}</tr>`,
            `<tr><td class="t">C (m)</td>${t.perCat.map(p=>`<td class="num auto"><b>${p.cM.toFixed(2)}</b></td>`).join("")}</tr>`]:[]).join("")}
          </tbody></table></div>
        ${(()=>{const lim=c.turns.filter(t=>t.limit!=null&&t.perCat.some(p=>p.limited));

          if(lim.length) out+=`<p class="note" style="color:#B45309;margin:6px 0 0">Annotate the procedure: ${lim.map(t=>`“Departure turn limited to ${t.limit} kt IAS maximum” (TP${t.n})`).join(" · ")}.</p>`;
          return out;})()}`:""}
        ${c&&c.turns[0]&&c.turns[0].beforeMin?`
        <p class="note" style="color:#B91C1C;font-weight:700;margin:6px 0 0">⚠ Turn 1 is ${c.turns[0].shortBy.toFixed(2)} m BEFORE the minimum
          first-turn distance — entered ${c.turns[0].dist.toFixed(2)} m vs minimum ${c.minDistM.toFixed(2)} m

        <button class="ghost sidp-addturn" data-si="${si}" style="padding:5px 14px;margin-top:8px">+ Add a turn</button>

          Turn speed defaults to the final MA IAS × ${crit("sidMassF")} per category (Table I-4-1-2 increased for departure mass); a per-turn limit reduces it but never below the intermediate MA IAS × ${crit("sidMassF")}. C = ${crit("sidCSec")} s at TAS(IAS, actual altitude, ISA+${crit("isaDev")}) + ${crit("sidWind")} kt wind.</p>
      </div></div>`;}).join("");
  return `${viewSidCommon(r,d)}
  <div class="hub" style="margin-top:18px">
    <div class="card full">

      </div>

    ${sidCards}
  </div>`;
}
function wireSidPage(key,procId){
  wireSidCommon(key);

    const pc=ensureProcCfg(key,procId);
    if(!pc.sids) pc.sids=[];
    return pc.sids;
  };
  const add=document.getElementById("sidp-add");
  if(add) add.addEventListener("click",()=>{
    getSids().push({name:"",pdg:"",turns:[{name:"",dist:"",limit:"",rtype:"none",restrict:""}]}); render();});
  const calc=document.getElementById("sidp-calc");
  if(calc) calc.addEventListener("click",()=>{
    const d2=compute(); const r2=d2.runways.find(x=>x.key===key);
    getSids().forEach(s=>{s.calcHash=sidHash(r2,s);});
    render();});
  document.querySelectorAll(".sidp-del").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); getSids().splice(+e.target.dataset.si,1); render();}));
  document.querySelectorAll(".sidp-name").forEach(inp=>inp.addEventListener("change",e=>{
    getSids()[+e.target.dataset.si].name=e.target.value; render();}));
  document.querySelectorAll(".sidp-catreset").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); delete getSids()[+e.target.dataset.si].cats; render();}));
  document.querySelectorAll(".sidp-cat").forEach(cb=>cb.addEventListener("change",e=>{
    const s=getSids()[+e.target.dataset.si];
    if(!s.cats){const rc=(ensureCfg(key).cats)||{};s.cats={A:!!rc.A,B:!!rc.B,C:!!rc.C,D:!!rc.D};}
    s.cats[e.target.dataset.cat]=e.target.checked; render();}));
  document.querySelectorAll(".sidp-pdg").forEach(inp=>inp.addEventListener("change",e=>{
    getSids()[+e.target.dataset.si].pdg=e.target.value; render();}));
  document.querySelectorAll(".sidp-turn").forEach(inp=>inp.addEventListener("change",e=>{
    getSids()[+e.target.dataset.si].turns[+e.target.dataset.ti][e.target.dataset.f]=e.target.value; render();}));
  document.querySelectorAll(".sidp-addturn").forEach(b=>b.addEventListener("click",e=>{
    getSids()[+e.target.dataset.si].turns.push({name:"",dist:"",limit:"",rtype:"none",restrict:""}); render();}));
  document.querySelectorAll(".sidp-delturn").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); getSids()[+e.target.dataset.si].turns.splice(+e.target.dataset.ti,1); render();}));
}

/* ---------- survey points ---------- */
function viewPoints(d){
  const filter=(S._ptFilter||"").toUpperCase();
  let shown=0;
  const rows=d.pts.map(p=>{
    if(filter && !(p.code.includes(filter)||String(p.id).toUpperCase().includes(filter)||String(p.assoc).toUpperCase().includes(filter))) return "";
    shown++;
    return `<tr>
      <td class="in">${esc(p.id)}</td><td class="in">${esc(p.code)}</td><td class="in">${esc(p.assoc)}</td>
      <td class="num in">${f3(p.e)}</td><td class="num in">${f3(p.n)}</td>
      <td class="num in">${f3(p.elevM)}</td><td class="num in">${f3(p.elevFt)}</td>
      <td class="t">${esc(p.ident)}</td>
      <td class="in">${esc(p.sdate)}</td></tr>`;}).join("");
  return `
  <h2>Survey points — the imported survey, as supplied</h2>
  <p class="note">Both elevations are <b>as surveyed</b> (CAP1732 fields 17 and 18) — the official point of truth.
    Nothing here is converted, derived or decided; which points count toward the aerodrome elevation is set on the
    <b>survey codes</b> page under Aerodrome elevation. The per-record survey date can differ between runways within one file.</p>
  <div class="filter-row">
    <label>Filter <input type="text" id="pt-filter" value="${esc(S._ptFilter||"")}" placeholder="code / ID / runway"></label>
    <span style="color:var(--muted)">${shown} of ${d.total} rows shown</span>
    <button class="ghost" id="btn-csv" style="margin-left:auto">Download points (CSV)</button>
  </div>
  <div class="tbl-wrap">
  <table><thead><tr>
    <th>Point_ID</th><th>Code</th><th>Runway_ID</th><th>Easting/X</th><th>Northing/Y</th>
    <th>Elev_m</th><th>Elev_ft</th><th>Ident</th><th>Survey_Date</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}
function wirePoints(){
  document.getElementById("pt-filter").addEventListener("input",e=>{S._ptFilter=e.target.value;render();});
  document.getElementById("btn-csv").addEventListener("click",exportCsv);
}

/* ---------- survey codes ---------- */
function viewCodes(d){
  const counts=new Map();
  for(const p of d.pts) counts.set(p.code,(counts.get(p.code)||0)+1);
  const unknown=[...counts.keys()].filter(c=>!CODES.has(c));
  const seenKnown=[...counts.keys()].filter(c=>CODES.has(c)).sort();
  const makeRow=(code,known)=>{
    const base=CODES.get(code);
    const inc=S.codeOverrides[code] ?? (base?base.include:"?");
    const n=counts.get(code)||0;
    return `<tr>
      <td class="${known?"":"chk-bad"}">${esc(code)}</td>
      <td class="t">${esc(base?base.canon:"")}</td>
      <td class="in"><select class="inc-sel" data-code="${esc(code)}">
        ${!known&&!(code in S.codeOverrides)?'<option selected>?</option>':""}
        <option${inc==="Y"?" selected":""}>Y</option>
        <option${inc==="N"?" selected":""}>N</option></select></td>
      <td class="num auto">${n||""}</td>
      <td class="auto">${esc(base?.llz||"")}</td>
      <td class="t" style="white-space:normal;max-width:520px">${esc(base?base.note:(known?"":"Not in the code table — decide whether this point counts as part of the runway."))}</td>
    </tr>`;};
  let html=`
  <h2>Survey codes — what counts as runway</h2>
  <p class="note">Include = <b>Y</b> means the point counts as <i>part of the runway</i> for the CAA aerodrome-elevation
    method. Changes recalculate everything immediately. Notable decisions carried over from the workbook:
    <b>ARP = N</b> (not a runway-surface value), <b>TODA_END = Y</b> (at your request — beyond the pavement where a clearway exists).</p>`;
  if(unknown.length){
    html+=`<div class="verdict bad"><div class="word">${unknown.length} UNRECOGNISED CODE(S)</div>
      <div class="detail">These points are excluded from the aerodrome-elevation max until you decide Y/N.</div></div>
      <div class="tbl-wrap auto-h"><table>
      <thead><tr><th>Code (as in survey)</th><th>Canonical</th><th>Include?</th><th>Seen (n)</th><th>LLZ role</th><th>Notes</th></tr></thead>
      <tbody>${unknown.map(c=>makeRow(c,false)).join("")}</tbody></table></div>`;
  }
  html+=`<h2 style="margin-top:22px">Codes in this survey</h2>
    <div class="tbl-wrap"><table>
    <thead><tr><th>Code (as in survey)</th><th>Canonical</th><th>Include?</th><th>Seen (n)</th><th>LLZ role</th><th>Notes</th></tr></thead>
    <tbody>${seenKnown.map(c=>makeRow(c,true)).join("")}</tbody></table></div>`;
  return html;
}
function wireCodes(){
  document.querySelectorAll(".inc-sel").forEach(s=>s.addEventListener("change",e=>{
    if(e.target.value==="?") return;
    S.codeOverrides[e.target.dataset.code]=e.target.value;
    render();
  }));
}

/* ============================ files in/out =========================== */
function handleSurveyFile(file){
  const errEl=document.getElementById("import-err");
  if(errEl) errEl.innerHTML="";
  const isCsv=/\.csv$/i.test(file.name);
  const reader=new FileReader();
  reader.onerror=()=>{ if(errEl) errEl.innerHTML=`<div class="err-log">Could not read the file.</div>`; };
  reader.onload=()=>{
    try{
      const rows=isCsv?parseCsvText(reader.result):parseXlsxBuffer(new Uint8Array(reader.result));
      loadSurvey(rows,file.name);
      go("hub");
    }catch(err){
      const el=document.getElementById("import-err");
      if(el) el.innerHTML=`<div class="err-log">Import failed — ${esc(err.message)}\n\nNothing was changed. Re-select a known-good CAP1732 file.</div>`;
    }
  };
  if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function download(name,data,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:mime}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCsv(){
  const d=compute(); if(!d) return;
  const head="Point_ID,Code,Runway_ID,Easting,Northing,Elev_m,Elev_ft,Ident,Survey_Date";
  const lines=d.pts.map(p=>[p.id,p.code,p.assoc,p.e,p.n,p.elevM,p.elevFt,p.ident,p.sdate].map(v=>String(v??"")).join(","));
  download(`${S.icao}_survey_points.csv`,[head,...lines].join("\n"),"text/csv");
}
/* --- project payload (shared by Save, Open and autosave) --- */
function projectPayload(){
  return {tool:"IFP Design Calculator project", version:2, saved:new Date().toISOString(),
    icao:S.icao, fileName:S.fileName, company:S.company, procDate:S.procDate,
    vertRef:S.vertRef, points:S.points,
    decisions:{tolMatch:S.tolMatch, manualAEP:S.manualAEP,
               codeOverrides:S.codeOverrides, rwyCfg:S.rwyCfg, manualLlz:S.manualLlz, criteria:S.criteria}};
}
function applyProject(p){
  if(!p||!String(p.tool||"").startsWith("IFP Design")||!Array.isArray(p.points))
    throw new Error("Not an IFP Design Calculator project file.");
  S.loaded=true; S.icao=p.icao||""; S.fileName=p.fileName||"";
  S.company=p.company||""; S.procDate=p.procDate||""; S.vertRef=p.vertRef||"";
  S.points=p.points;
  const dcs=p.decisions||{};
  S.tolMatch=dcs.tolMatch??0.005; S.manualAEP=dcs.manualAEP??"";
  S.codeOverrides=dcs.codeOverrides||{}; S.manualLlz=dcs.manualLlz||{};
  S.criteria=dcs.criteria||{};
  if(S.criteria.wind!=null){   // short-lived global wind key → per-procedure keys
    if(S.criteria.maWind==null) S.criteria.maWind=S.criteria.wind;
    if(S.criteria.sidWind==null) S.criteria.sidWind=S.criteria.wind;
    delete S.criteria.wind;
  }
  S.rwyCfg=dcs.rwyCfg||{};
  if(!dcs.rwyCfg && dcs.ilsDecl){        // migrate older project files
    for(const [k,v] of Object.entries(dcs.ilsDecl)) if(v==="YES")
      S.rwyCfg[k]={cats:{},procs:{ILS:true},proc:{}};
  }
  if((p.version||1)<2){   // v1 stored surveyed manual entries in FEET — the tool now works in metres
    const mA=safeNum(S.manualAEP);
    if(mA!=null) S.manualAEP=String(+(mA*FT_M).toFixed(4));
    if(S.tolMatch!=null&&S.tolMatch!==0.005) S.tolMatch=+(S.tolMatch*FT_M).toFixed(6);
    for(const cfg of Object.values(S.rwyCfg)){
      const mv=cfg&&cfg.sidCommon?safeNum(cfg.sidCommon.manElev):null;
      if(mv!=null) cfg.sidCommon.manElev=String(+(mv*FT_M).toFixed(4));
    }
  }
}
function saveProject(){
  if(!S.loaded) return;
  download(`${S.icao}_ifp_project.json`, JSON.stringify(projectPayload(),null,1), "application/json");
}
function openProject(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{ applyProject(JSON.parse(reader.result)); go("hub"); }
    catch(err){ alert("Could not open the project: "+err.message); }
  };
  reader.readAsText(file);
}
/* --- autosave: every change lands in this browser's local storage --- */
const AUTOSAVE_KEY="ifp_design_tool_autosave_v1";
function autosave(){
  if(!S.loaded) return;
  try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(projectPayload())); }catch(e){/* storage unavailable — Save project still works */}
}
function readAutosave(){
  try{ const t=localStorage.getItem(AUTOSAVE_KEY); return t?JSON.parse(t):null; }catch(e){ return null; }
}
function discardAutosave(){ try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){} }

/* ====================== CAA workbook export ========================== */
/* Generates the presentation workbook fresh from the live values.
   Colour convention matches the original tool:
     navy #1F3864 header (white text) · yellow #FFF2CC surveyed/entered
     grey #D9D9D9 calculated · red text = a check needing attention        */
const XC={ NAVY:"FF1F3864", YELLOW:"FFFFF2CC", GREY:"FFD9D9D9", WHITE:"FFFFFFFF",
           RED:"FFB42318", GREEN:"FF1E7B44", AMBER:"FF9A6700", BORDER:"FFBFBFBF" };
function xFill(argb){ return {type:"pattern",pattern:"solid",fgColor:{argb}}; }
function xBorder(){ const s={style:"thin",color:{argb:XC.BORDER}}; return {top:s,left:s,bottom:s,right:s}; }
function styleHeaderRow(row){
  row.eachCell(c=>{ c.fill=xFill(XC.NAVY); c.font={color:{argb:XC.WHITE},bold:true,size:9,name:"Arial"};
                    c.border=xBorder(); c.alignment={vertical:"middle"}; });
}
function dataCell(c,kind,numFmt){
  c.border=xBorder(); c.font={size:9,name:"Arial"};
  if(kind==="in") c.fill=xFill(XC.YELLOW);
  if(kind==="auto") c.fill=xFill(XC.GREY);
  if(numFmt) c.numFmt=numFmt;
}
function titleCell(ws,ref,text){
  const c=ws.getCell(ref); c.value=text;
  c.font={bold:true,size:11,name:"Arial",color:{argb:XC.NAVY}};
}
function sectionCell(ws,ref,text){
  const c=ws.getCell(ref); c.value=text;
  c.fill=xFill(XC.NAVY); c.font={color:{argb:XC.WHITE},bold:true,size:9,name:"Arial"};
}
async function exportCaaWorkbook(){
  const d=compute(); if(!d) return;
  const wb=new ExcelJS.Workbook();
  wb.creator="IFP Design Calculator"; wb.created=new Date();
  const genStamp=new Date().toISOString().slice(0,10);

  /* ---- Summary ---- */
  {
    const ws=wb.addWorksheet("Summary");
    ws.columns=[{width:36},{width:26},{width:60}];
    titleCell(ws,"A1",`${S.icao} — IFP DESIGN · SURVEY-DERIVED VALUES`);
    ws.getCell("A2").value=`Generated ${genStamp} by the IFP Design Calculator. Elevations are ORTHOMETRIC (AMSL), used AS SURVEYED (CAP1732 fields 17 & 18).`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const rows=[
      ["Aerodrome",S.icao],
      ["Survey originator",S.company||"—"],
      ["Survey processed",S.procDate||"—"],
      ["Vertical reference",S.vertRef||"—"],
      ["Source file",S.fileName],
      ["Survey points (total / included)",`${d.total} / ${d.included}`],
      ["Aerodrome elevation — surveyor effective (m)",d.effective],
      ["Aerodrome elevation — computed from survey (m)",d.maxP?d.maxP.inclM:null],
      ["Driving point",d.maxP?`${d.maxP.id} · ${d.maxP.code} · ${d.maxP.assoc||"—"}`:"—"],
      ["Difference computed − surveyor (m)",d.diff],
      ["Match tolerance (m)",S.tolMatch],
      ["STATUS",d.status],
      ["OPERATIVE AERODROME ELEVATION (m) — most conservative",d.operative],
      ["OPERATIVE — published (ft, ÷ 0.3048)",d.operative!=null?d.operative/FT_M:null],
      ["Operative value source",d.operativeSrc],
    ];
    let r=4;
    for(const [k,v] of rows){
      const ck=ws.getCell(r,1), cv=ws.getCell(r,2);
      ck.value=k; dataCell(ck,null);
      cv.value=v; dataCell(cv, typeof v==="number"?"auto":"auto",
                  typeof v==="number"?"0.000":null);
      if(k==="STATUS"){ cv.font={size:9,name:"Arial",bold:true,
        color:{argb:d.statusClass==="ok"?XC.GREEN:XC.AMBER}}; }
      if(k.startsWith("OPERATIVE")){ cv.font={size:9,name:"Arial",bold:true}; }
      r++;
    }
  }

  /* ---- Aerodrome_Elevation ---- */
  {
    const ws=wb.addWorksheet("Aerodrome_Elevation");
    ws.columns=[{width:44},{width:18},{width:16},{width:14}];
    titleCell(ws,"A1","AERODROME ELEVATION — CHECK OF THE SURVEYOR'S VALUE");
    ws.getCell("A2").value="Doc 8168: 'the elevation of the highest point of the landing area'. Check: the highest point on any part of the runway, computed from the included survey points, compared with the surveyor's AEP. The more conservative (higher) value is carried forward. AEP excluded from the computed max so the comparison stays independent.";
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    sectionCell(ws,"A4","A · SURVEYOR'S DECLARED VALUE");
    const put=(r,k,v,kind,fmt)=>{const ck=ws.getCell(r,1),cv=ws.getCell(r,2);
      ck.value=k;dataCell(ck,null);cv.value=v;dataCell(cv,kind,fmt);return cv;};
    put(5,"AEP from survey file (m)",d.aepFile,"auto","0.000");
    put(6,"From surveyor's report (m) — manual entry",d.manual,"in","0.000");
    put(7,"Surveyor's value — EFFECTIVE (m)",d.effective,"auto","0.000").font={bold:true,size:9,name:"Arial"};
    sectionCell(ws,"A9","B · COMPUTED FROM SURVEY (highest point on any part of the runway)");
    put(10,"Max elevation, included points (m)",d.maxP?d.maxP.inclM:null,"auto","0.000").font={bold:true,size:9,name:"Arial"};
    put(11,"Driving point — ID",d.maxP?d.maxP.id:"—","auto");
    put(12,"Driving point — code",d.maxP?d.maxP.code:"—","auto");
    put(13,"Driving point — runway",d.maxP?(d.maxP.assoc||"—"):"—","auto");
    put(14,"Points included / total",`${d.included} / ${d.total}`,"auto");
    put(15,"Unrecognised codes",d.unk.size,"auto");
    sectionCell(ws,"A17","C · COMPARISON");
    put(18,"Difference computed − surveyor (m)",d.diff,"auto","0.000");
    put(19,"Match tolerance (m)",S.tolMatch,"in","0.000");
    const st=put(20,"STATUS",d.status,"auto");
    st.font={bold:true,size:9,name:"Arial",color:{argb:d.statusClass==="ok"?XC.GREEN:XC.AMBER}};
    sectionCell(ws,"A22","D · OPERATIVE AERODROME ELEVATION — MOST CONSERVATIVE VALUE");
    put(23,"OPERATIVE AERODROME ELEVATION (m)",d.operative,"auto","0.000").font={bold:true,size:9,name:"Arial"};
    put(24,"Source",d.operativeSrc,"auto");
    put(25,"Published (ft) — ÷ 0.3048, Annex 5",d.operative!=null?d.operative/FT_M:null,"auto","0.000");
    put(26,"Driving point — field-18 ft as surveyed (cross-check)",d.maxP?d.maxP.elevFt:null,"auto","0.000");
    sectionCell(ws,"A27","E · PER-RUNWAY BREAKDOWN (included points only)");
    const hd=ws.getRow(28); hd.values=["Runway","Max elev (m)","Driving code","Point ID"];
    styleHeaderRow(hd);
    let r=29;
    for(const rw of d.runways){
      const vals=[rw.key, rw.rwyMax?rw.rwyMax.inclM:null, rw.rwyMax?rw.rwyMax.code:"—", rw.rwyMax?rw.rwyMax.id:"—"];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,"auto",i===1?"0.000":null);});

  }

  /* ---- Runways ---- */
  {
    const ws=wb.addWorksheet("Runways");
    titleCell(ws,"A1","RUNWAYS — PER-RUNWAY MASTER (SURVEY-DERIVED)");
    ws.getCell("A2").value="Elevations as surveyed (CAP1732 fields 17 & 18) — the metre value (field 17) is the working value; ft are published ÷ 0.3048 (Annex 5). ILS? is the designer's declaration. Only the localizer ANTENNA is used for THR→LLZ; monitor kit excluded.";
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Runway_ID","THR_Elev_m","THR_Elev_ft","THR_Easting","THR_Northing",
                "Categories","Procedures","LLZ_ident","LLZ_Easting","LLZ_Northing","THR_LLZ_m","LLZ_check","Survey_Ref"];
    ws.columns=cols.map((c,i)=>({width:i===12?38:(i===6?16:13)}));

    let r=5;
    for(const rw of d.runways){
      const vals=[rw.key,rw.thr.elevM,rw.thr.elevFt,rw.thr.e,rw.thr.n,
                  rw.catsOn.join(" ")||"—",rw.procsOn.join(", ")||"—",
                  rw.llzId||"",rw.llzE,rw.llzN,rw.dist,rw.llzCheck,rw.ref];
      const kinds=["in","in","in","in","in","in","in","in","in","in","auto","auto","auto"];
      const fmts=[null,"0.000","0.000","0.000","0.000",null,null,null,"0.000","0.000","0.00",null,null];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,kinds[i],fmts[i]);});
      if(rw.llzCheck!=="ok"&&rw.llzCheck!=="no ILS/LOC")
        ws.getCell(r,12).font={size:9,name:"Arial",bold:true,color:{argb:XC.AMBER}};
      r++;
    }
  }

  /* ---- ILS_Config (only when at least one runway has ILS declared) ---- */
  if(d.runways.some(rw=>rw.ilsOn)){
    const ws=wb.addWorksheet("ILS_Config");
    titleCell(ws,"A1","ILS CONFIGURATION — RDH & GLIDE PATH, PER RUNWAY");
    ws.getCell("A2").value=`Standard RDH ${crit("rdhStd")} ft. Glide path: minimum ${crit("vpaMin")}° · optimum ${crit("vpaOpt")}° · maximum ${crit("vpaMax")}°. RDH source is the designer's declaration of which value governs.`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Runway_ID","RDH_charted_ft","RDH_calibration_ft","Cal_report_ref","RDH_source",
                "RDH_operative_ft","Diff_cal_minus_charted_ft","vs_standard_50ft","Glide_path_deg","Angle_check","FAF_alt_ft"];
    ws.columns=cols.map((c,i)=>({width:i===3?22:14}));
    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r=5;
    for(const rw of d.runways.filter(x=>x.ilsOn)){
      const vals=[rw.key,rw.rdhCharted,rw.rdhCal,rw.ic.calRef||"",rw.rdhSource,
                  rw.rdhOperative,rw.rdhDiff,
                  rw.rdhOperative!=null?rw.rdhOperative-crit("rdhStd"):null,
                  rw.vpa,rw.vpaCheck||"",rw.faf];
      const kinds=["in","in","in","in","in","auto","auto","auto","in","auto","in"];
      const fmts=[null,"0.00","0.00",null,null,"0.00","0.00","0.00","0.00",null,"0"];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,kinds[i],fmts[i]);});
      if(rw.vpaCheck.startsWith("below")||rw.vpaCheck.startsWith("above"))
