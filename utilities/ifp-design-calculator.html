      if(rw.rdhCheck==="DIFFERS")
        ws.getCell(r,7).font={size:9,name:"Arial",bold:true,color:{argb:XC.AMBER}};
      r++;
    }
  }

  /* ---- ILS_Final (FAF & FAP calculations, only where computed) ---- */
  if(d.runways.some(rw=>rw.finalCalc)){
    const ws=wb.addWorksheet("ILS_Final");
    titleCell(ws,"A1","ILS — FINAL APPROACH · FAF TRACK LENGTH & FAP DISTANCE");
    ws.getCell("A2").value=`FAF: height above the RDH datum ÷ tan(glide path), rounded UP to 0.1 NM (NB PANS-OPS App C para 3 says nearest). FAP: H = h + ${OAS_FTNM}·D·tanθ + ${OAS_CURV_K}·D² solved for D with h = ${crit("rdhStd")} ft, then ΔD = ${RDH_ADJ_K} × ${OAS_FTNM} × (${crit("rdhStd")} − RDH) × cotθ at the actual angle.`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Runway_ID","THR_elev_ft","RDH_operative_ft","GP_deg","FAF_alt_ft",
                "Hgt_above_RDH_datum_ft","FAF_track_m","FAF_NM_unrounded","FAF_chart_NM",
                "D_NM","D_ft","RDH_adj_dD_ft","FAP_ft","FAP_m","FAP_NM"];

    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r2=5;
    for(const rw of d.runways.filter(x=>x.finalCalc)){
      const c=rw.finalCalc;
      const vals=[rw.key,rw.thrFt,rw.rdhOperative,rw.vpa,rw.faf,
                  c.hgt,c.fafM,c.fafNM,c.fafChart,c.Dnm,c.Dft,c.dD,c.fapFt,c.fapM,c.fapNM];
      const kinds=["in","in","in","in","in","auto","auto","auto","auto","auto","auto","auto","auto","auto","auto"];
      const fmts=[null,"0.000","0.00","0.00","0","0.000","0.000","0.0000","0.0","0.000000","0.00","0.000","0.00","0.000","0.0000"];
      vals.forEach((v,i)=>{const cell=ws.getCell(r2,i+1);cell.value=v;dataCell(cell,kinds[i],fmts[i]);});
      ws.getCell(r2,9).font={size:9,name:"Arial",bold:true};
      ws.getCell(r2,15).font={size:9,name:"Arial",bold:true};
      r2++;
    }
  }

  /* ---- Survey_Points ---- */
  {
    const ws=wb.addWorksheet("Survey_Points");
    titleCell(ws,"A1",`SURVEY POINTS — ${S.icao} · AS IMPORTED`);
    ws.getCell("A2").value=`Imported: ${S.icao} | ${S.company||"—"} | processed ${S.procDate||"—"} | vertical ref: ${S.vertRef||"—"} | ${d.total} points | ORTHOMETRIC (AMSL) elevations, as surveyed`;
    ws.getCell("A2").font={italic:true,size:9,name:"Arial"};
    const cols=["Point_ID","Code","Runway_ID","Easting/X","Northing/Y","Elev_m","Elev_ft",
                "Include?","Elev_m_incl","Ident","Survey_Date","LLZ_role"];
    ws.columns=cols.map((c,i)=>({width:i===9?30:12}));
    const hd=ws.getRow(4); hd.values=cols; styleHeaderRow(hd);
    let r=5;
    for(const p of d.pts){
      const vals=[p.id,p.code,p.assoc,p.e,p.n,p.elevM,p.elevFt,p.include,p.inclM,p.ident,p.sdate,p.llz||""];
      const kinds=["in","in","in","in","in","in","in","auto","auto",null,"in","auto"];
      const fmts=[null,null,null,"0.000","0.000","0.000","0.000",null,"0.000",null,null,null];
      vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;dataCell(c,kinds[i],fmts[i]);
        if(i===0||i===1||i===2||i===10) c.numFmt="@";});   // IDs/designators as text — "07" stays "07"
      if(p.include==="?") ws.getCell(r,8).font={size:9,name:"Arial",bold:true,color:{argb:XC.RED}};
      r++;
    }
  }

  const buf=await wb.xlsx.writeBuffer();
  download(`${S.icao}_IFP_CAA_${genStamp}.xlsx`, buf,
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* ============================ wiring ================================= */
document.getElementById("file-survey").addEventListener("change",e=>{
  if(e.target.files.length) handleSurveyFile(e.target.files[0]); e.target.value="";});
document.getElementById("file-project").addEventListener("change",e=>{
  if(e.target.files.length) openProject(e.target.files[0]); e.target.value="";});
document.getElementById("btn-save").addEventListener("click",saveProject);
document.getElementById("btn-load").addEventListener("click",()=>document.getElementById("file-project").click());
document.getElementById("btn-export").addEventListener("click",()=>{exportCaaWorkbook().catch(err=>alert("Export failed: "+err.message));});
/* Back/forward walk the tool's own views instead of leaving the page */
window.addEventListener("popstate",e=>{ if(e.state){ S.view=e.state; render(); window.scrollTo(0,0); } });
try{ history.replaceState(S.view,""); }catch(e){}
/* Leaving the document (close tab, back past the first page) asks first */
window.addEventListener("beforeunload",e=>{ if(S.loaded){ e.preventDefault(); e.returnValue=""; } });
render();
</script>
</body>
</html>
